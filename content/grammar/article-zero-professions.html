<div class="space-y-4 text-xs text-slate-700">
    <h3 class="font-bold text-sm text-slate-900">⚡ L'article zéro devant les professions</h3>
    <p class="leading-relaxed">En français, on omet l'article après le verbe <em>être</em> pour exprimer la profession : <em>Il est professeur</em> (et non *Il est un professeur*).</p>
