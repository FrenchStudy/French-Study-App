<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reading - French Study App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/conjugate.js"></script>
    <script src="js/library.js"></script>
    <script src="js/ideas.js"></script>
    <script src="js/topics-page.js"></script>
    <style>
        .w { cursor: pointer; border-radius: 4px; transition: background-color .12s; }
        .w:hover { background: #e0e7ff; }
        .w.on { background: #c7d2fe; color: #1e1b4b; }
        .sent.playing { background: #fef3c7; border-radius: 4px; }
        #text-body p + p { margin-top: 1rem; }
        #make-own > summary::-webkit-details-marker { display: none; }
        #make-own[open] .chev { transform: rotate(180deg); }
    </style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden font-sans text-slate-800">

    <header id="app-header" class="bg-white border-b border-slate-200 sticky top-0 z-50 shrink-0 h-14"></header>

    <main id="scroller" class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 py-5 space-y-4">

            <!-- ===== ALL TEXTS ===== -->
            <div id="list-view" class="space-y-4"></div>

            <!-- ===== WRITING A TEXT FOR A TOPIC ===== -->
            <div id="loading-view" class="hidden space-y-4">
                <button type="button" data-back class="min-h-[44px] px-1 text-sm font-semibold text-slate-600 hover:text-indigo-600">← All texts</button>
                <div class="bg-white border border-slate-200 rounded-2xl p-8 text-center space-y-3 max-w-xl mx-auto">
                    <div class="mx-auto w-10 h-10 rounded-full border-4 border-indigo-100 border-t-indigo-600 animate-spin" aria-hidden="true"></div>
                    <h1 id="loading-title" class="text-xl font-black text-slate-900"></h1>
                    <p class="text-sm text-slate-500">Writing this text for you at <b id="loading-level"></b>. It is then saved, so other students at this level get it straight away.</p>
                </div>
            </div>

            <!-- ===== ONE TEXT ===== -->
            <div id="text-view" class="hidden space-y-4">
                <button id="back" type="button" class="min-h-[44px] px-1 text-sm font-semibold text-slate-600 hover:text-indigo-600">← All texts</button>
                <div>
                    <span id="crumb" class="text-xs font-bold px-2 py-1 rounded-full bg-slate-100 text-slate-600"></span>
                    <h1 id="text-title" class="text-2xl lg:text-3xl font-black text-slate-900 leading-tight mt-2"></h1>
                    <div id="version-bar" class="mt-3 empty:hidden"></div>
                </div>

                <div class="flex flex-col lg:grid lg:grid-cols-[minmax(0,1fr)_24rem] gap-4 lg:gap-6">
                    <div class="space-y-3 min-w-0">
                        <div class="flex flex-wrap items-center gap-2">
                            <button id="btn-play" type="button" class="min-h-[44px] px-4 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl">▶ Read it to me</button>
                            <button id="btn-en" type="button" class="min-h-[44px] px-4 text-sm font-semibold text-slate-700 bg-white border border-slate-200 hover:border-indigo-300 rounded-xl">Show English</button>
                            <span class="text-xs text-slate-400">Tap any word for its meaning.</span>
                        </div>
                        <article id="text-body" lang="fr" class="bg-white border border-slate-200 rounded-2xl p-5 sm:p-7 text-lg leading-8 text-slate-900"></article>
                        <section id="en-box" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-5 sm:p-7 text-base leading-7 text-slate-600 whitespace-pre-line"></section>
                        <p id="text-note" class="hidden text-sm text-amber-800 bg-amber-50 border border-amber-200 rounded-xl p-3"></p>
                    </div>

                    <aside class="space-y-3 lg:sticky lg:top-4 lg:self-start">
                        <section class="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                            <div class="flex items-center justify-between gap-2">
                                <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500">Questions</h2>
                                <span id="q-score" class="text-sm font-bold text-slate-500"></span>
                            </div>
                            <div id="questions" class="space-y-4"></div>
                            <button id="btn-retry" type="button" class="hidden min-h-[40px] px-3 text-sm font-semibold text-slate-600 hover:text-indigo-700">↺ Try again</button>
                        </section>
                        <section id="saved-box" class="hidden bg-white border border-slate-200 rounded-2xl p-4 space-y-2">
                            <h2 class="text-sm font-bold uppercase tracking-wide text-slate-500">Words you saved</h2>
                            <div id="saved-words" class="flex flex-wrap gap-1.5"></div>
                            <a href="vocab.html?topic=review&amp;step=practise" class="inline-block text-sm font-semibold text-indigo-700 hover:underline">Review them in Vocab →</a>
                        </section>
                    </aside>
                </div>
            </div>
        </div>
    </main>

    <script>
        const $ = (id) => document.getElementById(id);
        const store = LIB.store;
        const LEVEL_STYLE = TopicsPage.LEVEL_STYLE;
        const PAGE = 'reading';
        let text = null;            // the open text
        let answers = {};           // question index -> chosen option (shuffled index)

        // ---------- One text ----------
        function openText(id, push) {
            const t = LIB.find(id);
            if (!t) { showList(false); return; }
            text = t; answers = {};
            LIB.stop(); stopPlay();
            if (push) history.pushState({ text: id }, '', 'reading.html?text=' + encodeURIComponent(id));
            $('list-view').classList.add('hidden');
            $('loading-view').classList.add('hidden');
            $('text-view').classList.remove('hidden');
            $('crumb').textContent = [t.level, t.source === 'mine' && !t.topic ? 'Your text' : t.kind, t.topic || (t.source === 'mine' ? '' : t.subject)].filter(Boolean).join(' · ');
            $('crumb').className = `text-xs font-bold px-2 py-1 rounded-full ${LEVEL_STYLE[t.level] ? LEVEL_STYLE[t.level].join(' ') : 'bg-slate-100 text-slate-600'}`;
            $('text-title').textContent = t.title;
            $('version-bar').innerHTML = TopicsPage.versionBar(t);
            $('text-body').innerHTML = LIB.renderText(t.fr).html;
            $('en-box').textContent = t.en || '';
            $('en-box').classList.add('hidden');
            $('btn-en').textContent = 'Show English';
            $('btn-en').classList.toggle('hidden', !t.en);
            $('text-note').classList.toggle('hidden', !t.note);
            $('text-note').textContent = t.note ? 'The AI could not add questions and a translation: ' + t.note : '';
            renderQuestions();
            renderSaved();
            $('scroller').scrollTop = 0;
        }
        function showList(push) {
            text = null; LIB.stop(); stopPlay(); LIB.closeWord();
            if (push) history.pushState({}, '', 'reading.html');
            $('text-view').classList.add('hidden');
            $('loading-view').classList.add('hidden');
            $('list-view').classList.remove('hidden');
            TopicsPage.render();
        }
        function renderQuestions() {
            const qs = text.questions || [];
            const done = Object.keys(answers).length;
            const right = qs.filter((q, i) => answers[i] !== undefined && LIB.shuffled(q, text.id + i)[answers[i]].right).length;
            $('q-score').textContent = done ? `${right}/${qs.length}` : '';
            $('btn-retry').classList.toggle('hidden', !done);
            if (!qs.length) { $('questions').innerHTML = '<p class="text-sm text-slate-500">This text has no questions.</p>'; return; }
            $('questions').innerHTML = qs.map((q, i) => {
                const opts = LIB.shuffled(q, text.id + i);
                const chosen = answers[i];
                return `<div class="space-y-2">
                    <p class="font-semibold text-slate-900">${i + 1}. ${escapeHtml(q.q)}</p>
                    <div class="space-y-1.5">${opts.map((o, j) => {
                        let cls = 'bg-white border-slate-200 hover:border-indigo-400 text-slate-800';
                        if (chosen !== undefined) cls = o.right ? 'bg-emerald-50 border-emerald-400 text-emerald-900' : j === chosen ? 'bg-rose-50 border-rose-400 text-rose-900' : 'bg-white border-slate-200 text-slate-400';
                        return `<button type="button" data-q="${i}" data-o="${j}" ${chosen !== undefined ? 'disabled' : ''} class="w-full text-left min-h-[44px] px-3 py-2 text-sm border rounded-xl transition ${cls}">${escapeHtml(o.text)}</button>`;
                    }).join('')}</div>
                    ${chosen !== undefined ? `<p class="text-sm ${opts[chosen].right ? 'text-emerald-800' : 'text-rose-800'}"><b>${opts[chosen].right ? 'Right.' : 'Not quite.'}</b> ${escapeHtml(q.why || '')}</p>` : ''}
                </div>`;
            }).join('') + (done === qs.length ? `<div class="rounded-xl p-3 text-center font-bold ${right === qs.length ? 'bg-emerald-50 text-emerald-800' : 'bg-slate-50 text-slate-700'}">${right === qs.length ? '🎉 All right!' : `You got ${right} out of ${qs.length}.`}</div>` : '');
            if (done === qs.length) LIB.saveResult(text.id, PAGE, right, qs.length);
        }
        function renderSaved() {
            const words = [...$('text-body').querySelectorAll('.w')].map(w => w.dataset.w);
            const progress = store.get('vocab_progress', {});
            const cache = store.get('vocab_words', {});
            const saved = Object.values(cache).filter(c => progress[c.key] && c.exFr && $('text-body').textContent.includes(c.exFr));
            $('saved-box').classList.toggle('hidden', !saved.length);
            $('saved-words').innerHTML = saved.map(c => `<span class="text-sm font-semibold px-2.5 py-1 bg-slate-100 text-slate-800 rounded-full">${escapeHtml(c.fr)}</span>`).join('');
            return words;
        }

        // ---------- Read aloud: sentence by sentence, highlighting each ----------
        let playing = false;
        function stopPlay() {
            playing = false; LIB.stop();
            document.querySelectorAll('.sent.playing').forEach(s => s.classList.remove('playing'));
            if ($('btn-play')) $('btn-play').textContent = '▶ Read it to me';
        }
        function playFrom(i) {
            const sents = [...$('text-body').querySelectorAll('.sent')];
            document.querySelectorAll('.sent.playing').forEach(s => s.classList.remove('playing'));
            if (!playing || i >= sents.length) { stopPlay(); return; }
            sents[i].classList.add('playing');
            sents[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            LIB.say(sents[i].textContent, 0.9, () => { if (playing) setTimeout(() => playFrom(i + 1), 250); });
        }

        // ---------- Events ----------
        document.addEventListener('click', (e) => {
            const opt = e.target.closest('[data-q]');
            if (opt && text) { answers[opt.dataset.q] = Number(opt.dataset.o); renderQuestions(); return; }
            const w = e.target.closest('#text-body .w');
            if (w && text) { LIB.openWord(w, text.id); return; }
            if (e.target.closest('[data-pop="add"]')) setTimeout(renderSaved, 0);
        });
        document.addEventListener('keydown', (e) => {
            const w = e.target.closest && e.target.closest('#text-body .w');
            if (w && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); LIB.openWord(w, text.id); }
        });
        document.querySelectorAll('#back, [data-back]').forEach(b => b.addEventListener('click', () => showList(true)));
        $('btn-retry').addEventListener('click', () => { answers = {}; renderQuestions(); });
        $('btn-en').addEventListener('click', () => {
            const hidden = $('en-box').classList.toggle('hidden');
            $('btn-en').textContent = hidden ? 'Show English' : 'Hide English';
        });
        $('btn-play').addEventListener('click', () => {
            if (playing) { stopPlay(); return; }
            playing = true; $('btn-play').textContent = '■ Stop';
            playFrom(0);
        });
        window.addEventListener('popstate', () => {
            const id = new URLSearchParams(location.search).get('text');
            const tp = new URLSearchParams(location.search).get('topic');
            if (id) openText(id, false); else if (tp) TopicsPage.openTopic(tp, false); else showList(false);
        });

        const params = new URLSearchParams(location.search);
        const startId = params.get('text'), startTopic = params.get('topic'), startTheme = params.get('theme');
        TopicsPage.init({
            page: PAGE, title: 'Reading', intro: "Something new every time: start the text picked for you, ask for any subject, or follow this week's theme.", ask: 'What do you want to read about?', classic: 'reading-classic.html',
            noun: 'text', nounPl: 'texts', icon: '', subjectHint: 'e.g. A day at the beach', genLabel: 'Write me a text', pasteLabel: 'Read my text',
            kinds: ['Article', 'Story', 'Dialogue', 'Email or message', 'Blog', 'Advert or notice'],
            meta: (t) => { const n = (String(t.fr).match(/[\p{L}]+/gu) || []).length; return `${n} words · ${Math.max(1, Math.round(n / 120))} min`; },
            openText, showList,
            isList: () => !$('list-view').classList.contains('hidden'),
            refreshVersions: () => { if (text && !$('text-view').classList.contains('hidden')) $('version-bar').innerHTML = TopicsPage.versionBar(text); },
            loading(topic) {
                if (!topic) { $('loading-view').classList.add('hidden'); return; }
                LIB.closeWord();
                ['list-view', 'text-view'].forEach(id => $(id).classList.add('hidden'));
                $('loading-view').classList.remove('hidden');
                $('loading-title').textContent = topic.title;
                $('loading-level').textContent = topic.level;
                $('scroller').scrollTop = 0;
            },
            versionError(msg) {
                $('text-view').classList.remove('hidden');
                $('version-bar').innerHTML = TopicsPage.versionBar(text);
                const el = $('version-bar').querySelector('[data-version-error]');
                if (el) { el.textContent = msg; el.classList.remove('hidden'); }
            },
            startTopic, startTheme
        });
        if (startId && LIB.find(startId)) openText(startId, false);
        else if (startId) { TopicsPage.render(); LIB.fetchOne(startId).then(t => { if (t) openText(t.id, false); }); }
        else if (!startTopic && !startTheme) TopicsPage.render();
    </script>
</body>
</html>
