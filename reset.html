<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password - Apprendre le Français</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Français">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-emerald-50 font-sans text-slate-800">
    <main class="min-h-screen flex items-center justify-center px-4 py-10">
        <section class="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-sm p-6 space-y-5">
            <div class="space-y-1">
                <h1 class="text-2xl font-black text-slate-900">Choose a new password</h1>
                <p class="text-base text-slate-600">At least 8 characters.</p>
            </div>
            <div id="message" class="hidden" role="alert"></div>
            <form id="form" class="space-y-4" novalidate>
                <div>
                    <label for="pw1" class="block text-sm font-semibold text-slate-700 mb-1">New password</label>
                    <input id="pw1" type="password" autocomplete="new-password" class="w-full text-base px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label for="pw2" class="block text-sm font-semibold text-slate-700 mb-1">Repeat it</label>
                    <input id="pw2" type="password" autocomplete="new-password" class="w-full text-base px-3 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <button type="submit" id="btn" class="w-full min-h-[48px] bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl disabled:opacity-60">Save new password</button>
            </form>
            <a href="login.html" class="block text-center text-sm font-semibold text-slate-600">← Back to sign in</a>
        </section>
    </main>
    <script>
        const db = window.mySupabase;
        const $ = (id) => document.getElementById(id);
        function show(kind, text) {
            $('message').textContent = text;
            $('message').className = 'text-sm rounded-xl p-3 ' + (kind === 'error' ? 'bg-rose-50 text-rose-800 border border-rose-200' : 'bg-emerald-50 text-emerald-800 border border-emerald-200');
        }
        $('form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const a = $('pw1').value, b = $('pw2').value;
            if (a.length < 8) return show('error', 'Your password needs at least 8 characters.');
            if (a !== b) return show('error', "The two passwords don't match.");
            if (!(await Account.session())) return show('error', 'This reset link has expired or was already used. Go back to sign in and request a new one.');
            $('btn').disabled = true;
            const { error } = await db.auth.updateUser({ password: a });
            $('btn').disabled = false;
            if (error) return show('error', error.message || 'Could not save the new password. Please try again.');
            show('ok', 'Password saved. Taking you to the app…');
            setTimeout(() => { location.href = 'index.html'; }, 1200);
        });
    </script>
</body>
</html>
