<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadowing - French Study App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/conjugate.js"></script>
    <script src="js/cheatsheet-data.js"></script>
    <script src="js/scenes.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
            <a href="index.html" class="text-sm font-semibold text-slate-600 hover:text-indigo-600">← Home</a>
            <h1 class="text-base font-bold text-slate-900">🎙️ Shadowing</h1>
            <button id="logoutBtn" class="text-sm text-slate-600 hover:text-red-600 px-2 py-1 rounded-lg">Logout</button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-5 space-y-4">

        <!-- Habit stats -->
        <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-white border border-slate-200 rounded-2xl p-3">
                <div id="stat-streak" class="text-xl font-black text-orange-500">0</div>
                <div class="text-xs text-slate-500">day streak</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-3">
                <div id="stat-today" class="text-xl font-black text-indigo-600">0</div>
                <div class="text-xs text-slate-500">phrases today</div>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl p-3">
                <div id="stat-total" class="text-xl font-black text-emerald-600">0</div>
                <div class="text-xs text-slate-500">phrases in total</div>
            </div>
        </div>

        <!-- Track picker -->
        <div>
            <label for="track-select" class="block text-sm font-semibold text-slate-700 mb-1">Track</label>
            <select id="track-select" class="w-full text-base px-3 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500"></select>
            <p id="track-hint" class="text-sm text-slate-500 mt-1"></p>
        </div>

        <!-- Phrase card -->
        <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex items-center justify-between text-sm text-slate-500">
                <span id="phrase-counter">1 / 1</span>
                <label class="flex items-center gap-2 cursor-pointer select-none">
                    <input type="checkbox" id="memory-toggle" class="w-5 h-5 accent-indigo-600">
                    From memory (hide text)
                </label>
            </div>

            <div id="phrase-box" class="space-y-1 min-h-[96px]">
                <p id="phrase-fr" class="text-2xl font-bold text-slate-900 leading-snug"></p>
                <p id="phrase-pron" class="text-sm text-indigo-600"></p>
                <p id="phrase-en" class="text-base text-slate-500"></p>
                <p id="phrase-note" class="text-sm text-amber-700"></p>
            </div>

            <!-- Word check result -->
            <div id="result-box" class="hidden bg-slate-50 border border-slate-100 rounded-xl p-3 space-y-2">
                <div class="text-sm font-semibold text-slate-700">What the app heard: <span id="result-score"></span></div>
                <div id="result-words" class="flex flex-wrap gap-1.5"></div>
                <p id="result-heard" class="text-sm text-slate-500 italic"></p>
            </div>
            <p id="mic-note" class="hidden text-sm text-amber-700 bg-amber-50 rounded-xl p-3"></p>

            <!-- Controls -->
            <div class="grid grid-cols-2 gap-2">
                <button id="btn-listen" class="min-h-[48px] bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl">🔊 Listen</button>
                <select id="speed-select" aria-label="Speed" class="min-h-[48px] text-base bg-slate-100 border border-slate-200 rounded-xl px-3">
                    <option value="1">Normal speed</option>
                    <option value="0.8">Slow</option>
                    <option value="0.6">Very slow</option>
                </select>
                <button id="btn-repeat" class="min-h-[48px] bg-rose-500 hover:bg-rose-600 text-white font-bold rounded-xl">🎙️ Repeat</button>
                <button id="btn-playback" class="min-h-[48px] bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl disabled:opacity-40" disabled>▶️ My recording</button>
            </div>

            <div class="flex items-center justify-between pt-1">
                <button id="btn-prev" class="min-h-[44px] px-4 text-slate-600 hover:text-indigo-600 font-semibold rounded-xl">← Previous</button>
                <button id="btn-next" class="min-h-[44px] px-5 bg-slate-900 hover:bg-slate-700 text-white font-semibold rounded-xl">Next →</button>
            </div>
        </section>

        <p class="text-sm text-slate-500">
            How it works: listen, repeat out loud, then compare your recording with the model.
            Your recordings stay on this device. Word checking works in Chrome and Edge.
        </p>
    </main>

    <script>
        // ---------- Tracks ----------
        const CS = window.CHEATSHEET;
        const C = window.Conjugator;

        const itemsFromBlocks = (ids) => ids.flatMap(id =>
            (CS.blocks[id]?.sections || []).flatMap(s => s.items.map(it => ({ fr: it[0], pron: it[1], en: it[2] })))
        );

        const verbChant = (inf, tense) => {
            const v = C.find(inf);
            const forms = C.forms(v, tense).map(r => /'$/.test(r.cp) ? r.cp + r.cf : r.cp.split(' / ')[0] + ' ' + r.cf);
            const tName = C.tenses.find(t => t.key === tense).name;
            return { fr: forms.join(', ').replace(/\(e\)|\(s\)/g, ''), en: `${inf} (${v.gloss}) — ${tName}` };
        };

        const TRACKS = [
            {
                name: '1. Sounds of French',
                hint: 'Tune your ear: u vs ou, the nasal vowels, and the French r.',
                items: [
                    { fr: 'tu, tout', en: 'you, all', note: 'u: round your lips and say "ee". ou: like "oo".' },
                    { fr: 'la rue, la roue', en: 'the street, the wheel', note: 'Same u vs ou contrast.' },
                    { fr: 'dessus, dessous', en: 'on top, underneath', note: 'u vs ou at the end of the word.' },
                    { fr: 'Tu as vu ?', en: 'Did you see?', note: 'Two u sounds.' },
                    { fr: 'le vin, le vent, ils vont', en: 'wine, wind, they go', note: 'Three nasal vowels: in, en, on. Do not say the n.' },
                    { fr: 'bon, le banc, le bain', en: 'good, bench, bath', note: 'on, an, ain.' },
                    { fr: 'un bon vin blanc', en: 'a good white wine', note: 'Four nasal sounds in a row.' },
                    { fr: 'Paris, rouge, la rue', en: 'Paris, red, the street', note: 'The r is made at the back of the throat.' },
                    { fr: 'Je prends le train.', en: 'I take the train.', note: 'r after a consonant.' },
                    { fr: 'Nous voulons du pain.', en: 'We want some bread.', note: 'ou, on, u and ain together.' }
                ]
            },
            {
                name: '2. Silent letters and liaison',
                hint: 'Most final consonants are silent; some link to the next vowel.',
                items: [
                    { fr: 'Ils parlent.', en: 'They speak.', note: 'The -ent of the verb is silent: sounds like "il parl".' },
                    { fr: 'les amis', en: 'the friends', note: 'Liaison: the s sounds like z, "lé-za-mi".' },
                    { fr: 'Vous avez un chat.', en: 'You have a cat.', note: 'vous‿avez: z sound.' },
                    { fr: 'les enfants', en: 'the children', note: 'z liaison, and the final t is silent.' },
                    { fr: 'Ils ont un chien.', en: 'They have a dog.', note: 'ils‿ont: z sound. Compare: ils sont (s sound).' },
                    { fr: "C'est un ami.", en: "He's a friend.", note: 'c\'est‿un: t sound.' },
                    { fr: 'Nous allons à Paris.', en: 'We are going to Paris.', note: 'nous‿allons: z sound. The s of Paris is silent.' },
                    { fr: 'Il est petit.', en: 'He is small.', note: 'Final t of petit is silent.' },
                    { fr: 'beaucoup, trop tard', en: 'a lot, too late', note: 'Final p and d are silent.' },
                    { fr: 'un grand homme', en: 'a great man', note: 'grand‿homme: the d links as a t sound.' }
                ]
            },
            {
                name: '3. Survival phrases',
                hint: 'Greetings, question words and phrases to get help.',
                items: itemsFromBlocks([1, 2, 25])
            },
            {
                name: '4. Numbers, time and prices',
                hint: 'Hear and say numbers and times quickly.',
                items: itemsFromBlocks([4, 6])
            },
            {
                name: '5. Verb chants',
                hint: 'Chant the key verbs until they come out without thinking.',
                items: [
                    ...['être', 'avoir', 'aller', 'faire', 'pouvoir', 'vouloir', 'devoir', 'savoir', 'venir', 'prendre', 'parler', 'finir']
                        .map(v => verbChant(v, 'pres')),
                    ...['parler', 'manger', 'aller', 'venir', 'faire', 'avoir', 'être']
                        .map(v => verbChant(v, 'pc')),
                    ...['être', 'avoir', 'parler'].map(v => verbChant(v, 'impf'))
                ]
            },
            {
                name: '6. Scene rehearsal',
                hint: 'Practise the lines before a role-play scene.',
                items: window.SCENES.flatMap(s => s.phrases.map(p => ({ fr: p[0], en: p[1], note: `${s.name}, ${s.role}` })))
            },
            {
                name: '7. Grammar in sentences',
                hint: 'Example sentences from every grammar topic, A1 to C2.',
                items: Object.keys(CS.grammar).flatMap(k => {
                    const g = CS.grammar[k];
                    return (g.ex || []).map(e => ({ fr: e[0], en: e[1], note: `${g.level} · ${g.title}` }));
                })
            }
        ];

        // ---------- State ----------
        let trackIndex = 0;
        let phraseIndex = 0;
        let recognition = null;
        let mediaRecorder = null;
        let recordingUrl = null;
        let isListening = false;

        const $ = (id) => document.getElementById(id);
        const store = {
            get(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } },
            set(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
        };

        // ---------- Habit stats (saved on this device for now) ----------
        function today() { return new Date().toISOString().slice(0, 10); }
        function loadStats() {
            const s = store.get('shadow_stats', { streak: 0, lastDay: null, todayCount: 0, total: 0 });
            if (s.lastDay !== today()) s.todayCount = 0;
            const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
            if (s.lastDay && s.lastDay !== today() && s.lastDay !== yesterday) s.streak = 0;
            return s;
        }
        function renderStats() {
            const s = loadStats();
            $('stat-streak').textContent = s.streak;
            $('stat-today').textContent = s.todayCount;
            $('stat-total').textContent = s.total;
        }
        function recordPractice() {
            const s = loadStats();
            if (s.lastDay !== today()) {
                const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
                s.streak = s.lastDay === yesterday ? s.streak + 1 : 1;
                s.lastDay = today();
            }
            s.todayCount += 1;
            s.total += 1;
            store.set('shadow_stats', s);
            renderStats();
        }

        // ---------- Rendering ----------
        function currentItem() { return TRACKS[trackIndex].items[phraseIndex]; }

        function renderPhrase() {
            const track = TRACKS[trackIndex];
            const item = currentItem();
            $('phrase-counter').textContent = `${phraseIndex + 1} / ${track.items.length}`;
            $('phrase-fr').textContent = item.fr;
            $('phrase-pron').textContent = item.pron ? `Say: ${item.pron}` : '';
            $('phrase-en').textContent = item.en || '';
            $('phrase-note').textContent = item.note || '';
            $('phrase-box').classList.toggle('blur-sm', $('memory-toggle').checked);
            $('result-box').classList.add('hidden');
            $('btn-playback').disabled = true;
            if (recordingUrl) { URL.revokeObjectURL(recordingUrl); recordingUrl = null; }
            store.set('shadow_position', { trackIndex, phraseIndex });
        }

        function renderTracks() {
            $('track-select').innerHTML = TRACKS.map((t, i) =>
                `<option value="${i}">${escapeHtml(t.name)} (${t.items.length})</option>`).join('');
            $('track-select').value = trackIndex;
            $('track-hint').textContent = TRACKS[trackIndex].hint;
        }

        // ---------- Word check ----------
        function words(text) {
            return String(text).toLowerCase()
                .normalize('NFD').replace(/[̀-ͯ]/g, '')
                .replace(/[’']/g, ' ').replace(/[^a-z0-9\s-]/g, ' ').replace(/-/g, ' ')
                .split(/\s+/).filter(Boolean);
        }

        function showResult(heardText) {
            const target = currentItem().fr;
            const heard = new Set(words(heardText));
            const tokens = target.split(/\s+/).filter(Boolean);
            let hit = 0, total = 0;
            const chips = tokens.map(tok => {
                const parts = words(tok);
                if (!parts.length) return '';
                total += 1;
                const ok = parts.every(p => heard.has(p));
                if (ok) hit += 1;
                return `<span class="px-2 py-1 rounded-lg text-sm font-semibold ${ok ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-200 text-slate-500'}">${escapeHtml(tok)}</span>`;
            }).join('');
            $('result-words').innerHTML = chips;
            $('result-score').textContent = total ? `${hit} of ${total} words` : '';
            $('result-heard').textContent = heardText ? `“${heardText}”` : 'Nothing was heard. Try again a little louder.';
            $('result-box').classList.remove('hidden');
        }

        // ---------- Recording ----------
        async function startRecorder() {
            if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const chunks = [];
                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    if (recordingUrl) URL.revokeObjectURL(recordingUrl);
                    recordingUrl = URL.createObjectURL(new Blob(chunks, { type: mediaRecorder.mimeType }));
                    $('btn-playback').disabled = false;
                };
                mediaRecorder.start();
            } catch (err) {
                mediaRecorder = null;
                showMicNote('Microphone access was blocked. Allow the microphone in your browser settings to record yourself.');
            }
        }
        function stopRecorder() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
        }

        function showMicNote(text) {
            $('mic-note').textContent = text;
            $('mic-note').classList.remove('hidden');
        }

        // ---------- Repeat: speech recognition + recording ----------
        function setListening(on) {
            isListening = on;
            $('btn-repeat').textContent = on ? '⏹️ Stop' : '🎙️ Repeat';
            $('btn-repeat').classList.toggle('animate-pulse', on);
        }

        function repeatPhrase() {
            if (isListening) {
                if (recognition) recognition.stop();
                stopRecorder();
                setListening(false);
                return;
            }
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            window.speechSynthesis && window.speechSynthesis.cancel();
            startRecorder();
            setListening(true);

            if (!SR) {
                showMicNote('This browser cannot check words. Recording only: tap Stop when you finish, then play it back.');
                return;
            }
            recognition = new SR();
            recognition.lang = 'fr-FR';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            let heardText = '';
            recognition.onresult = (e) => { heardText = Array.from(e.results).map(r => r[0].transcript).join(' '); };
            recognition.onerror = (e) => {
                if (e.error === 'not-allowed') showMicNote('Microphone access was blocked. Allow it in your browser settings.');
            };
            recognition.onend = () => {
                stopRecorder();
                setListening(false);
                showResult(heardText);
                if (heardText) recordPractice();
            };
            recognition.start();
        }

        // ---------- Wiring ----------
        $('btn-listen').addEventListener('click', () => speakFrench(currentItem().fr, parseFloat($('speed-select').value)));
        $('btn-repeat').addEventListener('click', repeatPhrase);
        $('btn-playback').addEventListener('click', () => { if (recordingUrl) new Audio(recordingUrl).play(); });
        $('btn-next').addEventListener('click', () => {
            phraseIndex = (phraseIndex + 1) % TRACKS[trackIndex].items.length;
            renderPhrase();
        });
        $('btn-prev').addEventListener('click', () => {
            const n = TRACKS[trackIndex].items.length;
            phraseIndex = (phraseIndex - 1 + n) % n;
            renderPhrase();
        });
        $('track-select').addEventListener('change', (e) => {
            trackIndex = Number(e.target.value);
            phraseIndex = 0;
            $('track-hint').textContent = TRACKS[trackIndex].hint;
            renderPhrase();
        });
        $('memory-toggle').addEventListener('change', () => $('phrase-box').classList.toggle('blur-sm', $('memory-toggle').checked));

        // Recordings without word checking still count once played back
        $('btn-playback').addEventListener('click', () => {
            if (!(window.SpeechRecognition || window.webkitSpeechRecognition)) recordPractice();
        });

        // ---------- Start ----------
        const saved = store.get('shadow_position', null);
        const params = new URLSearchParams(location.search);
        if (params.get('track')) {
            trackIndex = Math.min(TRACKS.length - 1, Math.max(0, Number(params.get('track')) - 1));
        } else if (saved && TRACKS[saved.trackIndex]) {
            trackIndex = saved.trackIndex;
            phraseIndex = Math.min(saved.phraseIndex, TRACKS[trackIndex].items.length - 1);
        }
        renderTracks();
        renderPhrase();
        renderStats();
    </script>
</body>
</html>
