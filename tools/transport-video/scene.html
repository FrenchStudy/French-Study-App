<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
#svg{position:absolute;inset:0}
#sub{position:absolute;left:0;right:0;bottom:0;padding:14px 60px 18px;background:linear-gradient(transparent,rgba(12,10,20,.86) 28%);text-align:center;color:#fff}
#sub .who{display:inline-block;font-size:17px;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:6px;letter-spacing:.03em}
#sub .fr{font-size:32px;font-weight:600;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#sub .fr b{color:#FFD54A;font-weight:800}
#sub .en{font-size:21px;color:#e6e0ef;font-style:italic;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#cap{position:absolute;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#cue{position:absolute;right:18px;top:14px;display:flex;gap:8px}
#cue .c{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px 7px;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#222;display:flex;align-items:center;gap:8px}
#cue img{width:36px;height:36px}
#cue .big{font-size:22px;font-weight:900}
#cue .sm{font-size:13px;font-weight:600;color:#555;line-height:1.2}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body><div id="stage"><svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="cap"></div><div id="cue"></div><div id="sub"></div><div id="black"></div></div>
<script>
let TL = null, T = 0, SC = null;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * cl(k);
const evs = (name) => TL.events.filter(e => e[0] === name && e[2] === SC.id);
const ev = (name) => { const e = evs(name)[0]; return e ? e[1] : 1e9; };
const evd = (name) => { const e = evs(name)[0]; return e ? e[3] : 0; };
const since = (name) => T - ev(name);
const amp = (who) => (TL.amp[who] || [])[Math.round(T * TL.fps)] || 0;
const speaking = (who) => TL.lines.some(l => l.who === who && T >= l.start && T <= l.end);
const lineEnd = (who, k) => { const l = TL.lines.filter(l => l.who === who && l.scene === SC.id)[k]; return l ? l.end : 1e9; };
const img = (f, x, y, s) => `<image href="pics/${f}.png" x="${x - s / 2}" y="${y - s}" width="${s}" height="${s}"/>`;
const tag = (t, x, y, k = 1, col = '#22223B') => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x - t.length * 4.7 - 11}" y="${y}" width="${t.length * 9.4 + 22}" height="28" rx="14" fill="${col}" opacity=".93"/><text x="${x}" y="${y + 19.5}" text-anchor="middle" font-size="17" font-weight="700" fill="#FFE9B0">${t}</text></g>`;
const fadeIn = (n, d = .3) => cl(since(n) / d);
const win = (n, a, b, f = .3) => cl((since(n) - a) / f) * cl((b - since(n)) / f);   // shown from a to b seconds after the event
const check = (x, y, k) => k <= 0 ? '' : `<g opacity="${k}" transform="translate(${x},${y}) scale(${back(k)})"><circle r="16" fill="#16A34A"/><path d="M-8,0 l5,6 l10,-12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>`;
const bubble = (x, y, w, h, tx, ty, k, body) => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#fff" stroke="#22223B" stroke-width="3"/><path d="M${tx - 24},${y + h - 2} L${tx},${ty} L${tx + 24},${y + h - 2}Z" fill="#fff" stroke="#22223B" stroke-width="3" stroke-linejoin="round"/><rect x="${tx - 22}" y="${y + h - 6}" width="44" height="8" fill="#fff"/>${body}</g>`;

// ---------- people ----------
const P = {
  L: { file: 'lea', col: '#B11F1F', skin: '#F1C3A5', name: ['Léa', '#B11F1F'] },
  G: { file: 'guichet', col: '#1F3A68', skin: '#A26D3D', name: ['la guichetière', '#1F3A68'] },
  C: { file: 'control', col: '#0F766E', skin: '#F1C3A5', name: ['la contrôleuse', '#0F766E'] },
  E: { file: 'aero', col: '#7C3AED', skin: '#E0AC69', name: ["l'enregistrement", '#7C3AED'] },
  R: { file: 'loc', col: '#15803D', skin: '#8D5524', name: ['la location de voitures', '#15803D'] },
  K: { file: 'camille', col: '#F97316', skin: '#F1C3A5', name: ['Camille · au téléphone', '#D9600B'] },
  A: { name: ['🔊 Annonce', '#334155'] },
};
const CAST = { gare: ['L', 'G'], train: ['L', 'C'], aero: ['L', 'E'], route: ['L', 'R'] };
const inTrain = () => SC.id === 'train' && since('ride') >= 0;
const driving = () => SC.id === 'route' && since('drive') >= 0;

function where(who) {
  const id = SC.id, w = evs('walk')[0];
  const walkIn = (to) => !w ? to : T < w[1] ? -320 : mix(-320, to, ease((T - w[1]) / w[3]));
  if (who === 'L') {
    if (id === 'gare') return { x: walkIn(600), top: 92, size: 300 };
    if (id === 'aero') return { x: walkIn(560), top: 92, size: 300 };
    if (id === 'route') return { x: walkIn(560), top: 92, size: 300 };
    if (id === 'train') {
      if (!inTrain()) {
        const p = evs('platform')[0];
        let x = T < p[1] ? -320 : mix(-320, 480, ease((T - p[1]) / 1.6)), top = 92, o = 1;
        const c = since('compost');
        if (c >= 0) x = mix(480, 700, ease(c / 0.9));
        const m = since('climb');
        if (m >= 0) { x = mix(700, 1010, ease(m / 0.9)); top = mix(92, 40, ease((m - 0.7) / 0.5)); o = 1 - cl((m - 0.9) / 0.4); }
        return { x, top, size: 300, o };
      }
      let x = 420, top = 160, sit = true;
      const g = since('getoff');
      if (g >= 0) { top = mix(160, 92, ease(g / 0.6)); sit = g < 0.3; x = mix(420, 1500, ease((g - 0.7) / 1.6)); }
      return { x, top, size: 300, sit };
    }
  }
  if (who === 'G') return { x: 1000, top: 112, size: 290 };
  if (who === 'E') return { x: 1010, top: 112, size: 290 };
  if (who === 'R') return { x: 1010, top: 112, size: 290 };
  if (who === 'C') {
    const r = since('ride'), wi = since('window');
    let x = r < 0 ? 1600 : mix(1500, 880, ease(r / 1.5));
    if (wi >= 0) x = mix(880, 1600, ease(wi / 1.6));
    return { x, top: 92, size: 300 };
  }
}
function at(t, f) { const t0 = T; T = t; const r = f(); T = t0; return r; }
const walking = (who) => Math.abs(where(who).x - at(T - 0.04, () => where(who).x)) > 0.6;

function faceSvg(who, x, top, size, tilt) {
  const a = speaking(who) ? amp(who) : 0;
  let m = a < 0.07 ? 'smile' : a < 0.5 ? 'laugh' : 'agape';
  let e = 'happy';
  if (who === 'L') {
    if ((since('late') >= 0 && since('late') < 2.2) || (since('cancel') >= -0.2 && since('cancel') < 2.6)) { e = 'wide'; if (!speaking('L')) m = 'agape'; }
    if (since('cancel') >= 2.6 && since('idea') < 0 && !speaking('L')) m = 'sad';
    if (since('idea') >= 0.2 && since('idea') < 2.4) e = 'bow';
    if (since('bike') >= 0 || (since('fill') > 2.2 && since('fill') < 3.2) || since('voie3') >= 0 && since('voie3') < 2) e = 'bow';
  }
  if (who === 'K' && since('hangup') >= 0) e = 'bow';
  const blink = ((T + { L: 0.4, G: 1.9, C: 1.1, E: 2.6, R: 0.9, K: 2.2 }[who]) % 3.7) < 0.13;
  if (blink) e = 'humble';
  return `<g transform="rotate(${tilt},${x},${top + size * 0.95})"><image href="chars/${P[who].file}-${m}-${e}.svg" x="${x - size / 2}" y="${top}" width="${size}" height="${size}"/></g>`;
}
function headMove(who, p) {
  let tilt = 0;
  const talker = CAST[SC.id].find(o => o !== who && speaking(o));
  if (talker && where(talker)) tilt = (where(talker).x > p.x ? 1 : -1) * 2.5;
  for (const o of CAST[SC.id]) if (o !== who) {
    const ended = TL.lines.filter(l => l.who === o && T > l.end && T < l.end + 0.7);
    if (ended.length) tilt += Math.sin((T - ended[0].end) / 0.7 * Math.PI) * 4;
  }
  if (speaking(who)) tilt += Math.sin(T * 3.1) * 1.2;
  return tilt;
}
function body(who) {
  const p = where(who); if (!p) return '';
  const c = P[who].col, wk = walking(who) ? Math.abs(Math.sin(T * 9)) * 6 : 0;
  const sc = p.size / 300, y0 = p.top - wk + p.size * 0.93;
  const shirt = who === 'L' ? '' : `<path d="M${p.x - 22 * sc},${y0} L${p.x},${y0 + 60 * sc} L${p.x + 22 * sc},${y0}Z" fill="#CFEAF7"/>`;
  return `<g opacity="${p.o ?? 1}"><rect x="${p.x - 92 * sc}" y="${y0}" width="${184 * sc}" height="${p.sit ? 150 : 460}" rx="${26 * sc}" fill="${c}"/>${shirt}${faceSvg(who, p.x, p.top - wk, p.size, headMove(who, p))}</g>`;
}
function arm(who, x1, y1, x2, y2, x3, y3) {
  return `<path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="${P[who].col}" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="#000" stroke-opacity=".08" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="${x3}" cy="${y3}" r="15" fill="${P[who].skin}"/>`;
}
function arms(who) {
  const p = where(who); if (!p) return '';
  const sh = p.top + p.size * 0.95, x = p.x, A = (...a) => arm(who, ...a);
  const down = (s) => A(x + s * 90, sh + 20, x + s * 112, sh + 110, x + s * 96, sh + 196);
  const desk = (s) => A(x + s * 90, sh + 20, x + s * 110, sh + 110, x + s * 70, sh + 150);
  const reach = (s, tx, ty) => A(x + s * 90, sh + 20, x + s * 150, sh + 90, tx, ty);
  const wave = (s) => A(x + s * 90, sh + 20, x + s * 132, sh - 30, x + s * 122 + Math.sin(T * 9) * 12, sh - 112);
  let s = `<g opacity="${p.o ?? 1}">`;
  if (who === 'L') {
    if (p.sit) {
      const ck = since('check');
      s += `<circle cx="${x - 70}" cy="476" r="15" fill="${P.L.skin}"/>`;
      if (ck >= 0 && ck < 3.4) s += reach(1, x + 150, sh + 40) + ticketCard(x + 210, sh - 20, 0.55);
      else s += `<circle cx="${x + 70}" cy="476" r="15" fill="${P.L.skin}"/>`;
      return s + '</g>';
    }
    s += down(-1);
    const tk = since('ticket'), cp = since('compost');
    if (SC.id === 'gare' && tk >= 0.9 && tk < 3) s += reach(1, x + 170, sh + 60);
    else if (SC.id === 'train' && cp >= 0.5 && cp < 1.6) s += reach(1, x + 150, sh + 70);
    else if (SC.id === 'route' && since('keys') >= 0.9 && since('keys') < 3) s += reach(1, x + 160, sh + 60);
    else if (SC.id === 'gare' && since('voie3') >= 0.4 && since('voie3') < 3) s += A(x + 90, sh + 20, x + 60, sh - 40, x - 20, sh - 120);   // points at the board
    else s += down(1);
    return s + '</g>';
  }
  if (who === 'C') { const ck = since('check'); return s + down(1) + (ck >= 0.5 && ck < 3.4 ? reach(-1, x - 170, sh + 30) + `<rect x="${x - 200}" y="${sh + 6}" width="34" height="56" rx="6" fill="#263238"/><rect x="${x - 195}" y="${sh + 12}" width="24" height="20" fill="#7CFC9A"/>` : down(-1)) + '</g>'; }
  // the people behind a desk
  const give = { G: 'ticket', E: 'pass', R: 'keys' }[who], g = since(give);
  if (g >= 0 && g < 1.4) s += A(x - 90, sh + 20, x - 160, sh + 80, mix(x - 80, x - 230, ease(g / 0.8)), sh + 50);
  else s += desk(-1);
  if (who === 'E' && since('gate') >= 0 && since('gate') < 2.6) s += A(x + 90, sh + 20, x + 60, sh - 40, x - 20, sh - 120);
  else if (since('bye') >= 0) s += wave(1); else s += desk(1);
  return s + '</g>';
}

// ---------- props ----------
function ticketCard(x, y, s = 1) {
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-130" y="-62" width="260" height="124" rx="10" fill="#fff" stroke="#B0A58F" stroke-width="2"/><rect x="-130" y="-62" width="260" height="24" rx="10" fill="#E65100"/><text x="-116" y="-44" font-size="14" font-weight="800" fill="#fff">BILLET</text>
    <text x="-116" y="-10" font-size="22" font-weight="800" fill="#222">PARIS → LYON</text><text x="-116" y="16" font-size="15" font-weight="700" fill="#555">aller simple · 2ᵈᵉ classe</text><text x="-116" y="40" font-size="15" font-weight="700" fill="#555">vendredi 10 h 00 · place 42</text></g>`;
}
function board(x, y, rows, opts = {}) {
  const w = opts.w || 460;
  let s = `<g transform="translate(${x},${y})"><rect x="0" y="0" width="${w}" height="${48 + rows.length * 40}" rx="8" fill="#0D1B3E" stroke="#41506B" stroke-width="5"/><text x="16" y="32" font-size="22" font-weight="800" fill="#FFD54A">${opts.title || 'DÉPARTS'}</text><text x="${w - 16}" y="32" text-anchor="end" font-size="15" fill="#9FB3D9">heure · destination · voie</text>`;
  rows.forEach((r, i) => {
    const yy = 48 + i * 40;
    if (r.hl) s += `<rect x="6" y="${yy}" width="${w - 12}" height="36" rx="5" fill="#FFD54A" opacity="${r.hl * .3}"/>`;
    s += `<text x="16" y="${yy + 26}" font-size="21" font-weight="700" fill="${r.tc || '#F5F5F5'}">${r[0]}</text><text x="96" y="${yy + 26}" font-size="21" font-weight="700" fill="#F5F5F5">${r[1]}</text>`;
    s += `<g transform="translate(${w - 150},${yy + 26}) scale(${r.vk || 1})"><text x="0" y="0" text-anchor="middle" font-size="21" font-weight="800" fill="#7CFC9A">${r[2]}</text></g>`;
    if (r[3]) s += `<rect x="${w - 118}" y="${yy + 5}" width="108" height="26" rx="5" fill="${r.ic || '#2E7D32'}"/><text x="${w - 64}" y="${yy + 24}" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">${r[3]}</text>`;
  });
  return s + '</g>';
}

// ---------- the places ----------
function hall() {   // the station, with the ticket office
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#D9D2C4"/><path d="M-300,40 Q640,-140 1600,40 V-200 H-300Z" fill="#B9D7EA"/>${[...Array(16)].map((_, i) => `<path d="M${-300 + i * 120},-200 V60" stroke="#7D8A96" stroke-width="5"/>`).join('')}<path d="M-300,40 Q640,-140 1600,40" stroke="#5E6B78" stroke-width="12" fill="none"/>`;
  s += `<rect x="-300" y="470" width="1900" height="400" fill="#A9A094"/>${[...Array(20)].map((_, i) => `<path d="M${-300 + i * 100},470 l-40,300" stroke="#958B7F" stroke-width="2"/>`).join('')}`;
  const bh = since('board_hl'), v3 = since('voie3');
  s += board(20, 60, [['09:45', 'Marseille', '5', ''], Object.assign(['10:00', 'Lyon', '3', ''], { hl: bh >= 0 ? 0.6 + 0.4 * Math.sin(T * 6) : 0, vk: v3 >= 0 && v3 < 2 ? 1 + 0.35 * Math.abs(Math.sin(v3 * 5)) : 1 }), ['10:12', 'Dijon', '9', '']]);
  s += `<rect x="740" y="40" width="520" height="430" fill="#7A5A3A"/><rect x="760" y="60" width="480" height="64" fill="#1F3A68"/><text x="1000" y="104" text-anchor="middle" font-size="32" font-weight="800" fill="#fff" letter-spacing="5">GUICHET</text><rect x="790" y="140" width="420" height="330" fill="#E8F1F6"/>`;
  s += img('high-speed-train', 260, 470, 110);
  return s;
}
function counter(label) { return `<rect x="760" y="452" width="500" height="320" fill="#8B6A48"/><rect x="750" y="440" width="520" height="22" rx="4" fill="#5C4330"/>${label ? `<text x="1010" y="520" text-anchor="middle" font-size="22" font-weight="800" fill="#F3E3C7">${label}</text>` : ''}`; }
function platform() {
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#C8D3DC"/><path d="M-300,0 H1600" stroke="#7D8A96" stroke-width="10"/>`;
  // the train along the platform, with its door
  s += `<rect x="-300" y="90" width="1900" height="330" rx="40" fill="#F4F6F8"/><rect x="-300" y="300" width="1900" height="44" fill="#1F4E8C"/><rect x="-300" y="344" width="1900" height="12" fill="#C62828"/>${[...Array(9)].map((_, i) => `<rect x="${-260 + i * 200}" y="140" width="150" height="90" rx="18" fill="#2B3A4A"/>`).join('')}<rect x="950" y="120" width="120" height="300" rx="12" fill="#DDE3E8" stroke="#90A4AE" stroke-width="4"/><circle cx="1050" cy="270" r="9" fill="#4CAF50"/>`;
  s += `<rect x="-300" y="420" width="1900" height="400" fill="#9C978F"/><rect x="-300" y="420" width="1900" height="16" fill="#E8D44D"/>`;
  // the little screen and the yellow machine
  const late = since('late') >= 0, dp = since('dep') >= 0;
  s += board(250, 30, [Object.assign([dp ? '10:20' : '10:00', 'Lyon', '3', late ? 'RETARD' : "à l'heure"], { tc: dp ? '#FF7043' : '#F5F5F5', ic: late ? '#C62828' : '#2E7D32' })], { w: 430, title: 'VOIE 3' });
  s += `<g transform="translate(860,330)"><rect x="-6" y="40" width="12" height="120" fill="#6D6D6D"/><rect x="-40" y="-30" width="80" height="80" rx="10" fill="#F9C80E" stroke="#B88E00" stroke-width="3"/><rect x="-22" y="-8" width="44" height="8" rx="3" fill="#333"/><text x="0" y="32" text-anchor="middle" font-size="11" font-weight="800" fill="#5D4500">COMPOSTER</text></g>`;
  return s;
}
function carriage() {
  const w = since('window');
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#E9E4DA"/>`;
  // the window and the countryside going past
  const off = (T - ev('ride')) * 260;
  s += `<clipPath id="wn"><rect x="80" y="80" width="1120" height="250" rx="26"/></clipPath><g clip-path="url(#wn)"><rect x="80" y="80" width="1120" height="250" fill="#BFE3F7"/>`;
  s += `<path d="M80,250 ${[...Array(30)].map((_, i) => `L${80 + i * 40},${230 - 30 * Math.sin((i * 40 + off * 0.3) / 120)}`).join(' ')} L1200,330 L80,330Z" fill="#8BC34A"/>`;
  s += `<rect x="80" y="292" width="1120" height="22" fill="#5DADE2"/>`;   // a river
  for (let k = 0; k < 8; k++) { const px = 1200 - ((off * 1.4 + k * 260) % 1400); s += `<rect x="${px}" y="150" width="8" height="180" fill="#6D6D6D"/>`; }
  if (w >= 0) {
    const go = (t0, sp) => 1300 - (w - t0) * sp;
    s += img('ferry', go(0, 260), 318, 90) + img('bicycle', go(1.2, 300), 290, 70) + img('motorcycle', go(2.2, 340), 290, 74);
  }
  s += `</g><rect x="80" y="80" width="1120" height="250" rx="26" fill="none" stroke="#9AA6B2" stroke-width="16"/>${[453, 826].map(x => `<rect x="${x}" y="80" width="20" height="250" fill="#9AA6B2"/>`).join('')}`;
  if (w >= 0) {
    s += tag('un bateau', mix(1300, 300, (w - 0.4) / 3.8), 340, win('window', 0.4, 3.4)) ;
    s += tag('un vélo', 1300 - (w - 1.6) * 300, 220, win('window', 1.6, 4.0)) + tag('une moto', 1300 - (w - 2.6) * 340, 180, win('window', 2.6, 4.6));
  }
  // the screen over the window
  const tm = since('term') >= 0, cr = since('corr') >= 0;
  s += `<rect x="440" y="24" width="400" height="46" rx="8" fill="#111"/><text x="640" y="56" text-anchor="middle" font-size="20" font-weight="700" fill="${cr ? '#FFD54A' : '#FF8A3D'}">${cr ? 'Correspondance : Grenoble, voie 7' : tm ? 'Terminus : Lyon Part-Dieu' : 'Paris → Lyon · direct'}</text>`;
  // the seats
  s += `<rect x="-300" y="430" width="1900" height="400" fill="#4A5568"/><path d="M220,300 q0,-40 40,-40 h70 q40,0 40,40 v170 h-150z" fill="#3949AB"/>`;
  return s;
}
function trainTable() { return `<path d="M120,452 L760,452 L790,600 L90,600Z" fill="#CFD8DC"/><path d="M90,600 L790,600 L790,614 L90,614Z" fill="#90A4AE"/>`; }
function airport() {
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#E3E8EE"/><rect x="-300" y="30" width="1900" height="300" fill="#B5D4EC"/>`;
  const fog = since('cancel') >= 0 ? cl(since('cancel') / 1.5) : 0.15;
  s += `<rect x="-300" y="230" width="1900" height="100" fill="#9E9E9E"/>${img('airplane', 200, 260, 170)}<rect x="-300" y="30" width="1900" height="300" fill="#ECEFF1" opacity="${fog * 0.75}"/>`;
  for (let i = 0; i < 12; i++) s += `<rect x="${-300 + i * 160}" y="30" width="10" height="300" fill="#90A4AE"/>`;

  for (const f of ['airplane', 'automobile', 'bicycle', 'cross-mark', 'ferry', 'fog', 'fuel-pump', 'high-speed-train', 'luggage', 'mobile-phone', 'motorcycle', 'old-key', 'passport-control', 'seat', 'taxi', 'ticket']) names.push(`pics/${f}.png`);
  await Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = n; })));
};
