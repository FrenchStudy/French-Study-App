<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
#svg{position:absolute;inset:0}
#sub{position:absolute;left:0;right:0;bottom:0;padding:14px 60px 18px;background:linear-gradient(transparent,rgba(5,10,25,.82) 28%);text-align:center;color:#fff}
#sub .who{display:inline-block;font-size:17px;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:6px;letter-spacing:.03em}
#sub .fr{font-size:33px;font-weight:600;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#sub .fr b{color:#FFD54A;font-weight:800}
#sub .en{font-size:21px;color:#d5dbe7;font-style:italic;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#cap{position:absolute;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.45);transform-origin:left top}
#cap small{display:block;font-weight:600;opacity:.9}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;pointer-events:none;opacity:0}
</style></head>
<body><div id="stage"><svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="cap"></div><div id="sub"></div><div id="flash"></div><div id="black"></div></div>
<script>
let TL = null;
const W = 1280, H = 720;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * cl(k);
function mixc(c1, c2, k) { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const A = p(c1), B = p(c2); return '#' + A.map((v, i) => Math.round(mix(v, B[i], k)).toString(16).padStart(2, '0')).join(''); }
let T = 0, SC = null;
const ev = (name) => { const e = TL.events.find(e => e[0] === name && e[2] === SC.id); return e ? e[1] : 1e9; };
const since = (name) => T - ev(name);
const amp = (who) => { const a = TL.amp[who]; return a[Math.round(T * TL.fps)] || 0; };
const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };

// ---------------- pieces ----------------
function cloud(x, y, s, fill, op = 1) {
  return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op}"><g fill="${fill}">
    <ellipse cx="0" cy="10" rx="90" ry="34"/><circle cx="-40" cy="-4" r="38"/><circle cx="10" cy="-22" r="50"/><circle cx="55" cy="0" r="36"/></g></g>`;
}
function sun(x, y, r, rot, glow = 0) {
  let rays = '';
  for (let i = 0; i < 12; i++) { const a = rot + i * Math.PI / 6; rays += `<line x1="${x + Math.cos(a) * (r + 12)}" y1="${y + Math.sin(a) * (r + 12)}" x2="${x + Math.cos(a) * (r + 34 + glow * 14)}" y2="${y + Math.sin(a) * (r + 34 + glow * 14)}" stroke="#FFC93C" stroke-width="7" stroke-linecap="round"/>`; }
  return `<circle cx="${x}" cy="${y}" r="${r + 30 + glow * 40}" fill="#FFE27A" opacity="${0.18 + glow * 0.25}"/>${rays}<circle cx="${x}" cy="${y}" r="${r}" fill="#FFC93C"/><circle cx="${x}" cy="${y}" r="${r * 0.72}" fill="#FFD95E"/>`;
}
function rain(n, speed, op, seed = 0, x0 = 0, x1 = W, yMax = 640) {
  let s = '';
  for (let i = 0; i < n; i++) { const x = x0 + rnd(i + seed) * (x1 - x0) - (T * 80) % 40; const y = ((T * speed + rnd(i * 3 + seed) * 900) % (yMax + 60)) - 50; s += `<line x1="${x}" y1="${y}" x2="${x - 6}" y2="${y + 26}" />`; }
  return `<g stroke="#cfe3ff" stroke-width="2.4" stroke-linecap="round" opacity="${op}">${s}</g>`;
}
function snow(n, op) {
  let s = '';
  for (let i = 0; i < n; i++) { const sp = 50 + rnd(i) * 60; const y = ((T * sp + rnd(i + 9) * 800) % 760) - 30; const x = rnd(i + 3) * W + Math.sin(T * 1.3 + i) * 18; s += `<circle cx="${x}" cy="${y}" r="${2.5 + rnd(i + 5) * 4}"/>`; }
  return `<g fill="#fff" opacity="${op}">${s}</g>`;
}
// Léa. o: x,y,s, coat, hat, scarf, glasses, left:'down'|'phone', right:'down'|'point'|'umbrella'|'wave'|'wipe', open, lookUp, wind
function lea(o) {
  const a = amp('L'), blink = ((T + 0.7) % 3.9) < 0.13 ? 0.12 : 1, skin = '#F3C9A6', hair = '#4A2C1D', coat = o.coat || '#E8574A';
  const bob = Math.sin(T * 2.2) * 1.5, look = o.lookUp || 0, wind = o.wind || 0;
  const arm = (x1, y1, x2, y2, x3, y3) => `<path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" fill="none" stroke="${coat}" stroke-width="17" stroke-linecap="round"/><circle cx="${x3}" cy="${y3}" r="10" fill="${skin}"/>`;
  let left = o.left === 'phone' ? arm(-36, -212, -78, -205, -50, -268) + `<rect x="-62" y="-300" width="18" height="36" rx="4" fill="#26303f" transform="rotate(-12,-53,-282)"/>` : arm(-36, -212, -56, -170, -54, -128);
  let right = '';
  if (o.right === 'point') right = arm(36, -212, 70, -250, 96, -322) + `<line x1="96" y1="-322" x2="106" y2="-344" stroke="${skin}" stroke-width="7" stroke-linecap="round"/>`;
  else if (o.right === 'umbrella') {
    const k = back(o.open || 0);
    right = `<line x1="58" y1="-160" x2="58" y2="-430" stroke="#333" stroke-width="5"/>` + arm(36, -212, 64, -190, 58, -172) +
      `<g transform="translate(40,-430) scale(${Math.max(0.05, k)},${Math.max(0.05, k)})"><path d="M-140,10 Q-130,-110 0,-118 Q130,-110 140,10 Q105,-12 70,10 Q35,-12 0,10 Q-35,-12 -70,10 Q-105,-12 -140,10Z" fill="${o.umbColor || '#3B6FD8'}"/><path d="M0,-118 Q-40,-60 -70,10 M0,-118 Q40,-60 70,10 M0,-118 L0,10" stroke="rgba(0,0,0,.18)" stroke-width="3" fill="none"/><circle cx="0" cy="-121" r="5" fill="#333"/></g>`;
  } else if (o.right === 'wave') { const w = Math.sin(T * 9) * 14; right = arm(36, -212, 80, -230, 92 + w, -300); }
  else if (o.right === 'wipe') right = arm(36, -212, 60, -260, 32, -318);
  else right = arm(36, -212, 56, -170, 54, -128);
  const mouth = a > 0.06 ? `<ellipse cx="0" cy="-261" rx="${8 + a * 2}" ry="${2 + a * 8}" fill="#8B2D2D"/>` : `<path d="M-9,-263 Q0,-255 9,-263" stroke="#8B2D2D" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  const hat = o.hat ? `<path d="M-52,-312 Q-50,-372 0,-374 Q50,-372 52,-312 Z" fill="#D8344A"/><rect x="-55" y="-322" width="110" height="18" rx="9" fill="#F2F2F2"/><circle cx="0" cy="-378" r="15" fill="#F2F2F2"/>` : '';
  const scarf = o.scarf ? `<path d="M-30,-238 Q0,-226 30,-238 L30,-222 Q0,-210 -30,-222Z" fill="${o.scarf}"/><path d="M14,-226 L${22 + wind * 40},${-170 - wind * 30} L${36 + wind * 50},${-176 - wind * 26} L26,-226Z" fill="${o.scarf}"/>` : '';
  const glasses = o.glasses ? `<g fill="#1d1d1d"><circle cx="-18" cy="-288" r="13"/><circle cx="18" cy="-288" r="13"/></g><line x1="-6" y1="-290" x2="6" y2="-290" stroke="#1d1d1d" stroke-width="3"/>` : '';
  const sweat = o.sweat ? `<path d="M40,-310 q-6,10 0,14 q6,-4 0,-14z" fill="#9fd3ff" opacity="${o.sweat}"/>` : '';
  const pony = `<ellipse cx="${54 + wind * 8}" cy="-276" rx="14" ry="34" fill="${hair}" transform="rotate(${18 + wind * 30 + Math.sin(T * 6) * wind * 8},54,-300)"/>`;
  return `<g transform="translate(${o.x},${o.y + bob}) scale(${o.s || 1})">
    <ellipse cx="0" cy="0" rx="62" ry="11" fill="rgba(0,0,0,.18)"/>
    <rect x="-24" y="-112" width="17" height="108" rx="7" fill="#2F3447"/><rect x="7" y="-112" width="17" height="108" rx="7" fill="#2F3447"/>
    <ellipse cx="-18" cy="-4" rx="16" ry="7" fill="#1E1E28"/><ellipse cx="18" cy="-4" rx="16" ry="7" fill="#1E1E28"/>
    <path d="M-46,-108 L46,-108 L33,-226 Q0,-240 -33,-226 Z" fill="${coat}"/>
    <rect x="-9" y="-248" width="18" height="24" fill="${skin}"/>
    ${scarf}${left}
    <g transform="rotate(${-look * 9},0,-240)">
      ${pony}
      <ellipse cx="0" cy="-298" rx="56" ry="54" fill="${hair}"/>
      <circle cx="0" cy="-284" r="45" fill="${skin}"/>
      <path d="M-50,-296 Q-44,-346 0,-346 Q44,-346 52,-296 Q30,-322 0,-320 Q-26,-320 -50,-296Z" fill="${hair}"/>
      <ellipse cx="-17" cy="${-288 - look * 3}" rx="5" ry="${6.5 * blink}" fill="#2B2B2B"/><ellipse cx="17" cy="${-288 - look * 3}" rx="5" ry="${6.5 * blink}" fill="#2B2B2B"/>
      <path d="M-26,-303 Q-17,-308 -8,-303 M8,-303 Q17,-308 26,-303" stroke="${hair}" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="-28" cy="-268" r="7" fill="#F29A8E" opacity=".45"/><circle cx="28" cy="-268" r="7" fill="#F29A8E" opacity=".45"/>
      ${mouth}${glasses}${hat}${sweat}
    </g>${right}</g>`;
}
// Hugo, on the phone, in a bubble
function hugo(x, y, k, ringing) {
  if (k <= 0) return '';
  const a = amp('H'), blink = ((T + 2.1) % 4.3) < 0.13 ? 0.12 : 1, s = back(k);
  const mouth = a > 0.06 ? `<ellipse cx="0" cy="22" rx="${8 + a * 2}" ry="${2 + a * 8}" fill="#6E2A22"/>` : `<path d="M-9,20 Q0,27 9,20" stroke="#6E2A22" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  let rings = '';
  if (ringing) for (let i = 0; i < 2; i++) { const p = ((T * 1.4) + i * 0.5) % 1; rings += `<circle r="${84 + p * 40}" fill="none" stroke="#fff" stroke-width="3" opacity="${1 - p}"/>`; }
  return `<g transform="translate(${x},${y}) scale(${s})">${rings}
    <circle r="84" fill="#fff"/><circle r="76" fill="#BFE3F2"/>
    <clipPath id="hc"><circle r="76"/></clipPath><g clip-path="url(#hc)">
      <path d="M-60,90 Q-55,52 0,48 Q55,52 60,90Z" fill="#2E7D5B"/>
      <rect x="-10" y="36" width="20" height="18" fill="#D9A27E"/>
      <circle cx="0" cy="0" r="40" fill="#D9A27E"/>
      <path d="M-41,-6 Q-42,-46 0,-46 Q42,-46 41,-6 Q34,-30 0,-30 Q-30,-30 -41,-6Z" fill="#2B211C"/>
      <path d="M-30,18 Q0,48 30,18 Q28,38 0,42 Q-28,38 -30,18Z" fill="#2B211C" opacity=".35"/>
      <ellipse cx="-14" cy="-2" rx="4.5" ry="${6 * blink}" fill="#222"/><ellipse cx="14" cy="-2" rx="4.5" ry="${6 * blink}" fill="#222"/>
      <path d="M-22,-15 Q-14,-19 -6,-15 M6,-15 Q14,-19 22,-15" stroke="#2B211C" stroke-width="3" fill="none" stroke-linecap="round"/>
      ${mouth}
      <rect x="34" y="-14" width="15" height="32" rx="4" fill="#26303f"/>
    </g>
    <rect x="-46" y="92" width="92" height="30" rx="15" fill="#2E7D5B"/><text x="0" y="113" text-anchor="middle" font-size="18" font-weight="700" fill="#fff">Hugo</text></g>`;
}
function thermo(x, y, k, val, label) {
  if (k <= 0) return '';
  const s = back(k), fill = cl((T - (ev('thermo') + 0.2)) / 1.0) * val;
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-16" y="-150" width="32" height="150" rx="16" fill="#fff" stroke="#444" stroke-width="3"/>
   <circle cx="0" cy="6" r="26" fill="#E8574A" stroke="#444" stroke-width="3"/><rect x="-7" y="${-(fill * 1.3)}" width="14" height="${fill * 1.3 + 6}" fill="#E8574A"/>
   <g font-size="13" fill="#444">${[0, 10, 20, 30, 40].map(v => `<line x1="16" y1="${-v * 3 - 20}" x2="26" y2="${-v * 3 - 20}" stroke="#444" stroke-width="2"/>`).join('')}</g>
   <rect x="34" y="-92" width="${label.length * 20 + 20}" height="48" rx="12" fill="#fff" stroke="#E8574A" stroke-width="3"/><text x="${44 + label.length * 10}" y="-58" text-anchor="middle" font-size="30" font-weight="800" fill="#E8574A">${label}</text></g>`;
}
function tree(x, y, s, leaf, sway = 0) {
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-9" y="-90" width="18" height="90" fill="#6B4A2F"/>
    <g transform="rotate(${sway},0,-90)" fill="${leaf}"><circle cx="0" cy="-130" r="50"/><circle cx="-38" cy="-100" r="36"/><circle cx="38" cy="-100" r="36"/></g></g>`;
}
function pine(x, y, s, snowK = 0) {
  return `<g transform="translate(${x},${y}) scale(${s})"><rect x="-6" y="-20" width="12" height="20" fill="#5A3E2B"/>
   <path d="M0,-150 L45,-60 L25,-60 L55,-20 L-55,-20 L-25,-60 L-45,-60Z" fill="#1F5E46"/>
   <path d="M0,-150 L22,-106 Q0,-96 -22,-106Z M-32,-62 Q0,-50 32,-62 L40,-58 Q0,-44 -40,-58Z" fill="#fff" opacity="${snowK}"/></g>`;
}
function icon(kind, x, y, s) {
  const g = (b) => `<g transform="translate(${x},${y}) scale(${s})">${b}</g>`;
  if (kind === 'flower') return g(`<line x1="0" y1="10" x2="0" y2="50" stroke="#3E9A57" stroke-width="6"/><path d="M0,40 Q18,26 26,36 Q14,48 0,40" fill="#3E9A57"/>${[0, 1, 2, 3, 4].map(i => `<ellipse cx="${Math.cos(i * 1.257) * 16}" cy="${Math.sin(i * 1.257) * 16 - 4}" rx="12" ry="12" fill="#F48FB1"/>`).join('')}<circle cx="0" cy="-4" r="10" fill="#FFD54A"/>`);
  if (kind === 'sun') return g(`${[...Array(8)].map((_, i) => `<line x1="${Math.cos(i * .785) * 30}" y1="${Math.sin(i * .785) * 30}" x2="${Math.cos(i * .785) * 44}" y2="${Math.sin(i * .785) * 44}" stroke="#FFC93C" stroke-width="6" stroke-linecap="round"/>`).join('')}<circle r="24" fill="#FFC93C"/>`);
  if (kind === 'leaf') return g(`<path d="M-30,30 Q-34,-30 30,-34 Q34,24 -30,30Z" fill="#E07B2A"/><path d="M-30,30 L22,-24" stroke="#A4501A" stroke-width="4"/>`);
  if (kind === 'flake') return g(`<g stroke="#9ED8F5" stroke-width="6" stroke-linecap="round">${[0, 1, 2].map(i => `<line x1="${Math.cos(i * 1.047) * -38}" y1="${Math.sin(i * 1.047) * -38}" x2="${Math.cos(i * 1.047) * 38}" y2="${Math.sin(i * 1.047) * 38}"/>`).join('')}</g><circle r="7" fill="#9ED8F5"/>`);
  if (kind === 'rain') return g(cloud(0, -6, 0.42, '#9AA8BA') + `<g stroke="#5DA9F0" stroke-width="5" stroke-linecap="round"><line x1="-20" y1="22" x2="-26" y2="40"/><line x1="0" y1="22" x2="-6" y2="44"/><line x1="20" y1="22" x2="14" y2="40"/></g>`);
  if (kind === 'wind') return g(`<g fill="none" stroke="#7FB8D8" stroke-width="6" stroke-linecap="round"><path d="M-40,-14 H16 Q34,-14 34,-30 Q34,-44 20,-44"/><path d="M-40,6 H30 Q46,6 46,22 Q46,36 32,36"/><path d="M-40,24 H0"/></g>`);
}
const FR_MAP = 'M0.47,0 L0.62,0.08 L0.85,0.17 L0.95,0.25 L0.88,0.48 L0.92,0.62 L0.97,0.8 L0.8,0.9 L0.62,0.93 L0.5,0.98 L0.32,0.92 L0.2,0.88 L0.25,0.66 L0.22,0.52 L0.08,0.4 L0,0.32 L0.18,0.28 L0.3,0.22 L0.38,0.1Z';
function france(x, y, s) { return `<g transform="translate(${x},${y}) scale(${s})"><path d="${FR_MAP}" fill="#7CC3E8" stroke="#fff" stroke-width="${3 / s}" stroke-linejoin="round"/><ellipse cx="1.04" cy="0.86" rx="0.03" ry="0.07" fill="#7CC3E8" stroke="#fff" stroke-width="${2 / s}"/></g>`; }

// ---------------- scenes ----------------
function studio(first) {
  let s = `<defs><linearGradient id="st" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2A4E"/><stop offset="1" stop-color="#0E1631"/></linearGradient></defs>
    <rect width="1280" height="720" fill="url(#st)"/><rect y="560" width="1280" height="160" fill="#0A1027"/>
    <g opacity=".25">${[...Array(9)].map((_, i) => `<circle cx="${80 + i * 140}" cy="40" r="5" fill="#9ec7ff"/>`).join('')}</g>
    <rect x="560" y="70" width="640" height="420" rx="22" fill="#14335E" stroke="#3E6DB0" stroke-width="6"/>`;
  s += france(600, 150, 250);
  s += `<text x="1160" y="122" text-anchor="end" font-size="34" font-weight="800" fill="#fff">La météo</text>`;
  if (first) {
    const names = [['flower', 'printemps'], ['sun', 'été'], ['leaf', 'automne'], ['flake', 'hiver']];
    names.forEach(([k, n], i) => { const e = since('ic' + i); if (e < 0) return; const sc = back(e / 0.45), x = 990 + (i % 2) * 130, y = 210 + Math.floor(i / 2) * 150;
      s += `<g opacity="${cl(e / .2)}"><circle cx="${x}" cy="${y}" r="${54 * sc}" fill="#fff" opacity=".12"/>${icon(k, x, y, sc)}<text x="${x}" y="${y + 86}" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">${n}</text></g>`; });
    s += lea({ x: 300, y: 600, s: 1.15, coat: '#E8574A' });
  } else {
    const t = [['sun', 'Soleil'], ['rain', 'Pluie'], ['wind', 'Vent'], ['flake', 'Neige']];
    t.forEach(([k, n], i) => { const e = since('t' + i); if (e < 0) return; const sc = back(e / 0.45), x = 990 + (i % 2) * 130, y = 210 + Math.floor(i / 2) * 150;
      s += `<g opacity="${cl(e / .2)}"><rect x="${x - 56}" y="${y - 60}" width="112" height="150" rx="18" fill="#fff" opacity=".12"/>${icon(k, x, y, sc)}<text x="${x}" y="${y + 80}" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">${n}</text></g>`; });
    const um = since('umbrella'), wv = since('wave');
    s += lea({ x: 300, y: 600, s: 1.15, coat: '#E8574A', right: wv >= 0 ? 'wave' : um >= 0 ? 'umbrella' : 'down', open: um / 0.6, umbColor: '#F5B700' });
  }
  return s;
}
function spring() {
  const cl1 = since('cloud1'), cl2 = since('cloud2'), cls = since('clouds'), rs = since('rainstart'), um = since('umbrella'), lk = since('look');
  const grey = cl(cls / 1.5) * 0.55 + cl(rs / 1.5) * 0.35;
  const sky1 = mixc('#7EC8F2', '#7C8796', grey), sky2 = mixc('#D9F1FF', '#B5BCC6', grey);
  let s = `<defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky1}"/><stop offset="1" stop-color="${sky2}"/></linearGradient></defs><rect width="1280" height="720" fill="url(#sk)"/>`;
  s += `<g opacity="${1 - cl(cls / 1.2) * 0.9}">${sun(330, 150, 56, T * 0.25, cl(since('sunny') / .6) * (1 - cl((since('sunny') - 2.5) / 1)))}</g>`;
  // Eiffel tower, far away
  s += `<g fill="${mixc('#8A9BB5', '#6E7685', grey)}" transform="translate(1010,560)"><path d="M-70,0 L-14,-300 L-6,-380 L6,-380 L14,-300 L70,0 L44,0 Q0,-90 -44,0Z"/><rect x="-36" y="-150" width="72" height="12"/><rect x="-22" y="-260" width="44" height="10"/><rect x="-1.5" y="-410" width="3" height="32"/></g>`;
  s += `<rect y="520" width="1280" height="200" fill="${mixc('#7BC86C', '#5E8F57', grey)}"/><path d="M0,560 Q640,500 1280,580 L1280,720 L0,720Z" fill="${mixc('#6BB85C', '#527D4C', grey)}"/>`;
  s += `<path d="M560,720 Q600,610 760,540 L840,540 Q720,620 720,720Z" fill="${mixc('#E8D6AE', '#B9AE96', grey)}"/>`;
  s += tree(120, 560, 1.2, mixc('#4FA34A', '#3E7A3B', grey)) + tree(1210, 590, 1.0, mixc('#4FA34A', '#3E7A3B', grey));
  // flowers
  for (let i = 0; i < 14; i++) s += `<circle cx="${40 + rnd(i) * 1200}" cy="${610 + rnd(i + 4) * 90}" r="6" fill="${['#F48FB1', '#FFD54A', '#fff'][i % 3]}"/>`;
  // bench
  s += `<g transform="translate(560,600)" fill="#7A5134"><rect x="-120" y="-60" width="240" height="14" rx="4"/><rect x="-120" y="-96" width="240" height="12" rx="4"/><rect x="-108" y="-50" width="10" height="50"/><rect x="98" y="-50" width="10" height="50"/></g>`;
  // clouds
  if (cl1 > 0) s += cloud(mix(1420, 820, ease(cl1 / 1.2)), 150, 0.9, mixc('#FFFFFF', '#C9CED6', grey));
  if (cl2 > 0) s += cloud(mix(-200, 470, ease(cl2 / 1.2)), 110, 0.8, mixc('#FFFFFF', '#C9CED6', grey));

const DRAW = { studio1: () => studio(true), spring, summer, autumn, winter, studio2: () => studio(false) };

function render(t) {
  T = t;
  SC = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  document.getElementById('svg').innerHTML = DRAW[SC.id]();
  // fade in/out between scenes
  const fin = cl((t - SC.start) / 0.45), fout = cl((SC.end - t) / 0.45);
  document.getElementById('black').style.opacity = 1 - Math.min(fin, fout);
  // flash for lightning
  let fl = 0; if (SC.id === 'summer') { [since('storm'), since('flash2')].forEach(f => { if (f >= 0 && f < 0.35) fl = Math.max(fl, (1 - f / 0.35) * 0.75); }); }

  // caption: big in the middle first, then a small label in the corner
  const cap = document.getElementById('cap'), parts = SC.caption.split(' · ');
  if (SC.id.startsWith('studio')) { cap.innerHTML = ''; }
  else {
    cap.innerHTML = `${parts[0]}${parts[1] ? `<small>${parts[1]}</small>` : ''}`;
    const k = ease((t - SC.start - 1.1) / 0.6);
