<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
#svg{position:absolute;inset:0}
#sub{position:absolute;left:0;right:0;bottom:0;padding:14px 60px 18px;background:linear-gradient(transparent,rgba(12,10,20,.86) 28%);text-align:center;color:#fff}
#sub .who{display:inline-block;font-size:17px;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:6px;letter-spacing:.03em}
#sub .fr{font-size:32px;font-weight:600;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#sub .fr b{color:#FFD54A;font-weight:800}
#sub .en{font-size:21px;color:#e6e0ef;font-style:italic;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#cap{position:absolute;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#cue{position:absolute;right:18px;top:14px;display:flex;gap:8px}
#cue .c{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px 7px;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#222;display:flex;align-items:center;gap:8px}
#cue img{width:36px;height:36px}
#cue .big{font-size:22px;font-weight:900}
#cue .sm{font-size:13px;font-weight:600;color:#555;line-height:1.2}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body><div id="stage"><svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="cap"></div><div id="cue"></div><div id="sub"></div><div id="black"></div></div>
<script>
let TL = null, T = 0, SC = null;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * cl(k);
const evs = (name) => TL.events.filter(e => e[0] === name && e[2] === SC.id);
const ev = (name) => { const e = evs(name)[0]; return e ? e[1] : 1e9; };
const evd = (name) => { const e = evs(name)[0]; return e ? e[3] : 0; };
const since = (name) => T - ev(name);
const amp = (who) => (TL.amp[who] || [])[Math.round(T * TL.fps)] || 0;
const speaking = (who) => TL.lines.some(l => l.who === who && T >= l.start && T <= l.end);
const lineEnd = (who, k) => { const l = TL.lines.filter(l => l.who === who && l.scene === SC.id)[k]; return l ? l.end : 1e9; };
const img = (f, x, y, s) => `<image href="pics/${f}.png" x="${x - s / 2}" y="${y - s}" width="${s}" height="${s}"/>`;
const tag = (t, x, y, k = 1, col = '#22223B') => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x - t.length * 4.7 - 11}" y="${y}" width="${t.length * 9.4 + 22}" height="28" rx="14" fill="${col}" opacity=".93"/><text x="${x}" y="${y + 19.5}" text-anchor="middle" font-size="17" font-weight="700" fill="#FFE9B0">${t}</text></g>`;
const fadeIn = (n, d = .3) => cl(since(n) / d);
const win = (n, a, b, f = .3) => cl((since(n) - a) / f) * cl((b - since(n)) / f);   // shown from a to b seconds after the event
const check = (x, y, k) => k <= 0 ? '' : `<g opacity="${k}" transform="translate(${x},${y}) scale(${back(k)})"><circle r="16" fill="#16A34A"/><path d="M-8,0 l5,6 l10,-12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>`;
const bubble = (x, y, w, h, tx, ty, k, body) => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#fff" stroke="#22223B" stroke-width="3"/><path d="M${tx - 24},${y + h - 2} L${tx},${ty} L${tx + 24},${y + h - 2}Z" fill="#fff" stroke="#22223B" stroke-width="3" stroke-linejoin="round"/><rect x="${tx - 22}" y="${y + h - 6}" width="44" height="8" fill="#fff"/>${body}</g>`;

// ---------- people ----------
const P = {
  L: { file: 'lea', col: '#B11F1F', skin: '#F1C3A5', name: ['Léa', '#B11F1F'] },
  U: { file: 'durand', col: '#0E7490', skin: '#F1C3A5', name: ['Mme Durand · une cliente', '#0E7490'] },
  H: { file: 'hotel', col: '#9F1239', skin: '#7A4A2A', name: ["la réceptionniste de l'hôtel", '#9F1239'] },
  O: { file: 'leroy', col: '#B45309', skin: '#F1C3A5', name: ["Mme Leroy · la chambre d'hôte", '#B45309'] },
  Q: { file: 'leroy', col: '#B45309', skin: '#F1C3A5', name: ['Mme Leroy · au téléphone', '#B45309'] },
};
const CAST = { hotel: ['L', 'U', 'H'], accueil: ['L', 'O'], chambre: ['L', 'O'] };

function where(who) {
  const id = SC.id, w = evs('walk')[0];
  const walkIn = (from, to) => !w ? to : T < w[1] ? from : mix(from, to, ease((T - w[1]) / w[3]));
  if (id === 'hotel') {
    const sw = since('swap'), lv = evs('leave')[0];
    if (who === 'U') return sw < 0 ? { x: 600, top: 100, size: 290 } : { x: mix(600, -400, ease(sw / 1.8)), top: 100, size: 290 };
    if (who === 'H') return { x: 1010, top: 112, size: 290 };
    if (who === 'L') {
      let x = walkIn(-320, 200);
      if (sw >= 0) x = mix(200, 600, ease((sw - 0.4) / 1.4));
      if (lv && T >= lv[1]) x = mix(600, -360, ease((T - lv[1]) / lv[3]));
      return { x, top: 92, size: 300 };
    }
  }
  if (id === 'accueil') {
    if (who === 'L') return { x: walkIn(-320, 600), top: 92, size: 300 };
    if (who === 'O') return { x: 1010, top: 100, size: 290 };
  }
  if (id === 'chambre') {
    if (who === 'L') return { x: walkIn(1500, 760), top: 92, size: 300 };
    if (who === 'O') {
      const k = since('knock'), lv = since('leave');
      if (k < 0.6) return null;
      let x = mix(1500, 1090, ease((k - 0.6) / 1.5));
      if (lv >= 1.2) x = mix(1090, 1550, ease((lv - 1.2) / 1.6));
      return { x, top: 100, size: 290 };
    }
  }
  return null;
}
function at(t, f) { const t0 = T; T = t; const r = f(); T = t0; return r; }
const walking = (who) => { const a = where(who), b = at(T - 0.04, () => where(who)); return a && b && Math.abs(a.x - b.x) > 0.6; };

function faceSvg(who, x, top, size, tilt) {
  const a = speaking(who) ? amp(who) : 0;
  let m = a < 0.07 ? 'smile' : a < 0.5 ? 'laugh' : 'agape';
  let e = 'happy';
  if (who === 'L') {
    if (since('full') >= 0 && since('full') < 2.6) { e = 'wide'; if (!speaking('L')) m = 'sad'; }
    if (since('cold') >= 0 && since('heat') < 0.6) { if (!speaking('L')) m = 'agape'; }
    if (since('notowel') >= 0 && since('phone') < 0 && !speaking('L')) m = 'sad';
    if ((since('cdh') >= 0.4 && since('cdh') < 3) || (since('window') >= 0 && since('window') < 2.4) || (since('heat') >= 0.6 && since('heat') < 2.4) || (since('give') >= 0 && since('give') < 3) || since('bye') >= 0) e = 'bow';
  }
  if (who === 'O' && since('key') >= 0 && since('key') < 2.4) e = 'bow';
  const blink = ((T + { L: 0.4, U: 1.9, H: 1.1, O: 2.6, Q: 2.6 }[who]) % 3.7) < 0.13;
  if (blink) e = 'humble';
  return `<g transform="rotate(${tilt},${x},${top + size * 0.95})"><image href="chars/${P[who].file}-${m}-${e}.svg" x="${x - size / 2}" y="${top}" width="${size}" height="${size}"/></g>`;
}
function headMove(who, p) {
  let tilt = 0;
  const talker = CAST[SC.id].find(o => o !== who && speaking(o) && where(o));
  if (talker) tilt = (where(talker).x > p.x ? 1 : -1) * 2.5;
  for (const o of CAST[SC.id]) if (o !== who) {
    const ended = TL.lines.filter(l => l.who === o && T > l.end && T < l.end + 0.7);
    if (ended.length) tilt += Math.sin((T - ended[0].end) / 0.7 * Math.PI) * 4;
  }
  if (speaking(who)) tilt += Math.sin(T * 3.1) * 1.2;
  if (who === 'L' && since('cold') >= 0 && since('heat') < 0.4) tilt += Math.sin(T * 40) * 1.6;   // shivers
  return tilt;
}
function body(who) {
  const p = where(who); if (!p) return '';
  const c = P[who].col, wk = walking(who) ? Math.abs(Math.sin(T * 9)) * 6 : 0;
  const sc = p.size / 300, y0 = p.top - wk + p.size * 0.93;
  const shirt = who === 'H' ? `<path d="M${p.x - 22 * sc},${y0} L${p.x},${y0 + 60 * sc} L${p.x + 22 * sc},${y0}Z" fill="#F3E5F5"/>` : '';
  return `<g><rect x="${p.x - 92 * sc}" y="${y0}" width="${184 * sc}" height="460" rx="${26 * sc}" fill="${c}"/>${shirt}${faceSvg(who, p.x, p.top - wk, p.size, headMove(who, p))}</g>`;
}
function arm(who, x1, y1, x2, y2, x3, y3) {
  return `<path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="${P[who].col}" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="#000" stroke-opacity=".08" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="${x3}" cy="${y3}" r="15" fill="${P[who].skin}"/>`;
}
function arms(who) {
  const p = where(who); if (!p) return '';
  const sh = p.top + p.size * 0.95, x = p.x, A = (...a) => arm(who, ...a);
  const down = (s) => A(x + s * 90, sh + 20, x + s * 112, sh + 110, x + s * 96, sh + 196);
  const desk = (s) => A(x + s * 90, sh + 20, x + s * 110, sh + 110, x + s * 70, sh + 150);
  const reach = (s, tx, ty) => A(x + s * 90, sh + 20, x + s * 150, sh + 90, tx, ty);
  if (who === 'L') {
    let s = down(-1);
    if (SC.id === 'chambre' && since('phone') >= 0 && since('knock') < 0) return s + A(x + 90, sh + 20, x + 150, sh - 20, x + 70, p.top + 190) + img('mobile-phone', x + 92, p.top + 230, 70);
    if (SC.id === 'chambre' && since('heat') >= -0.6 && since('heat') < 0.8) return s + reach(-1, x - 300, 380);
    if (SC.id === 'chambre' && since('ac') >= 0 && since('ac') < 1.2) return s + A(x + 90, sh + 20, x + 60, sh - 60, x - 20, sh - 150);
    const k = SC.id === 'accueil' ? since('key') : SC.id === 'chambre' ? since('give') : 1e9;
    if (k >= 0.8 && k < 2.6) return s + reach(1, x + 160, sh + 60);
    return s + down(1);
  }
  if (who === 'U') return down(-1) + (since('key1') >= 0.8 && since('key1') < 2.4 ? reach(1, x + 160, sh + 60) : down(1));
  if (who === 'O' && SC.id === 'chambre') {
    // carrying the pile, then giving it
    const g = since('give');
    if (g < 0) return A(x - 90, sh + 20, x - 120, sh + 80, x - 60, sh + 120) + A(x + 90, sh + 20, x + 60, sh + 110, x + 20, sh + 130);
    return down(1) + (g < 1.4 ? reach(-1, mix(x - 80, x - 230, ease(g / .8)), sh + 60) : since('leave') >= 0 ? A(x - 90, sh + 20, x - 132, sh - 30, x - 122 + Math.sin(T * 9) * 12, sh - 112) : down(-1));
  }
  // behind a desk: gives the key
  const give = who === 'H' ? 'key1' : 'key', g = since(give);
  return (g >= 0 && g < 1.4 ? A(x - 90, sh + 20, x - 160, sh + 80, mix(x - 80, x - 230, ease(g / 0.8)), sh + 50) : desk(-1)) + desk(1);
}

// ---------- small drawings ----------
const DR = {
  towel: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-44" y="-30" width="88" height="44" rx="6" fill="#4FC3F7"/><rect x="-44" y="-30" width="88" height="10" fill="#fff" opacity=".7"/><rect x="-44" y="4" width="88" height="6" fill="#fff" opacity=".7"/></g>`,
  pillow: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-58,-26 Q0,-38 58,-26 Q66,0 58,26 Q0,36 -58,26 Q-66,0 -58,-26Z" fill="#FAFAFA" stroke="#CFD8DC" stroke-width="3"/></g>`,
  blanket: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-60" y="-34" width="120" height="58" rx="8" fill="#5C6BC0"/>${[-40, -10, 20, 50].map(a => `<path d="M${a - 6},-34 v58" stroke="#9FA8DA" stroke-width="5"/>`).join('')}<path d="M-60,-6 h120" stroke="#9FA8DA" stroke-width="5"/></g>`,
  sheets: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})">${[0, 1, 2].map(i => `<rect x="-52" y="${-40 + i * 18}" width="104" height="18" rx="4" fill="#fff" stroke="#CFD8DC" stroke-width="2"/>`).join('')}</g>`,
  dryer: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><path d="M-40,-30 h70 q20,0 20,20 q0,20 -20,20 h-70z" fill="#EC407A"/><circle cx="-40" cy="-10" r="22" fill="#D81B60"/><rect x="0" y="8" width="20" height="52" rx="6" fill="#D81B60"/><path d="M10,60 q-10,30 20,40" stroke="#555" stroke-width="3" fill="none"/></g>`,
  single: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-26" y="-50" width="52" height="96" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/><rect x="-18" y="-44" width="36" height="20" rx="6" fill="#fff" stroke="#CFD8DC" stroke-width="2"/><rect x="-26" y="-14" width="52" height="60" rx="6" fill="#7986CB"/></g>`,
  double: (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-50" y="-50" width="100" height="96" rx="8" fill="#ECEFF1" stroke="#90A4AE" stroke-width="3"/><rect x="-42" y="-44" width="38" height="20" rx="6" fill="#fff" stroke="#CFD8DC" stroke-width="2"/><rect x="4" y="-44" width="38" height="20" rx="6" fill="#fff" stroke="#CFD8DC" stroke-width="2"/><rect x="-50" y="-14" width="100" height="60" rx="6" fill="#E57373"/></g>`,
};

// ---------- places ----------
function lobby() {
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#1F2A44"/>${[...Array(30)].map((_, i) => `<path d="M${-300 + i * 64},-200 v700" stroke="#2C3B5E" stroke-width="18"/>`).join('')}<rect x="-300" y="470" width="1900" height="400" fill="#7B5E44"/>${[...Array(22)].map((_, i) => `<path d="M${-300 + i * 90},470 l-30,300" stroke="#6A4F38" stroke-width="3"/>`).join('')}`;
  s += `<rect x="760" y="30" width="500" height="64" rx="8" fill="#C9A227"/><text x="1010" y="72" text-anchor="middle" font-size="26" font-weight="800" fill="#1F2A44" letter-spacing="2">HÔTEL DE LA PLAGE ★★★</text>`;
  // the board of keys behind the desk: empty when the hotel is full
  const full = since('full') >= 0;
  s += `<rect x="1150" y="130" width="140" height="230" rx="8" fill="#5D4330"/>${[...Array(12)].map((_, i) => { const kx = 1172 + (i % 3) * 44, ky = 160 + Math.floor(i / 3) * 52; const has = !full && i % 4 !== 1 && !(i === 4 && since('key1') >= 0); return `<circle cx="${kx}" cy="${ky}" r="4" fill="#C9A227"/>${has ? `<path d="M${kx},${ky} v22" stroke="#C9A227" stroke-width="4"/><circle cx="${kx}" cy="${ky + 28}" r="7" fill="none" stroke="#C9A227" stroke-width="3"/>` : ''}<text x="${kx}" y="${ky - 8}" text-anchor="middle" font-size="9" fill="#E6D3B0">${i + 1}</text>`; }).join('')}`;
  s += `<rect x="40" y="110" width="300" height="200" rx="6" fill="#0F172A" stroke="#C9A227" stroke-width="8"/><path d="M40,250 Q190,200 340,250 V310 H40Z" fill="#1E5AA8"/><circle cx="270" cy="160" r="24" fill="#FFE082"/>`;
  s += `<rect x="330" y="330" width="70" height="140" fill="#3E2C20"/><circle cx="365" cy="300" r="50" fill="#2E7D32"/><circle cx="335" cy="270" r="32" fill="#43A047"/>`;
  return s;
}
function hotelDesk() {
  const fk = since('full'), on = fk >= 0;
  return `<rect x="760" y="452" width="500" height="320" fill="#4E342E"/><rect x="750" y="440" width="520" height="22" rx="4" fill="#C9A227"/>${img('bellhop-bell', 840, 446, 64)}
    <g transform="translate(940,492)"><rect x="-90" y="-28" width="180" height="56" rx="10" fill="${on ? '#C62828' : '#3E2723'}" stroke="${on ? '#FF8A80' : '#5D4037'}" stroke-width="4"/><text x="0" y="12" text-anchor="middle" font-size="30" font-weight="900" fill="${on ? '#fff' : '#6D4C41'}" letter-spacing="3">COMPLET</text></g>`;
}
function hallway() {   // the chambre d'hôte: a stone house by the sea
  let s = `<rect x="-300" y="-200" width="1900" height="1000" fill="#EFE6D6"/>${[...Array(14)].map((_, r) => [...Array(18)].map((_, c) => `<rect x="${-300 + c * 110 + (r % 2) * 55}" y="${-200 + r * 50}" width="104" height="44" rx="10" fill="#E3D6C0"/>`).join('')).join('')}<rect x="-300" y="470" width="1900" height="400" fill="#A47551"/>`;
  s += `<rect x="440" y="40" width="320" height="200" rx="8" fill="#0D1B3E"/><path d="M440,170 Q600,140 760,170 V240 H440Z" fill="#1E4E8C"/>${img('crescent-moon', 690, 120, 70)}<rect x="440" y="40" width="320" height="200" rx="8" fill="none" stroke="#6D4C41" stroke-width="10"/><path d="M600,40 V240" stroke="#6D4C41" stroke-width="6"/>`;
  s += `<rect x="800" y="40" width="420" height="60" rx="8" fill="#B45309"/><text x="1010" y="80" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Chambre d'hôte · Mme Leroy</text>`;
  return s;
}
function cdhDesk() { return `<rect x="830" y="452" width="380" height="320" fill="#8D6E63"/><rect x="820" y="440" width="400" height="20" rx="4" fill="#6D4C41"/>${img('house-with-garden', 1150, 446, 70)}`; }
function room() {
  const night = since('bye') >= 0 ? cl(since('bye') / 1.4) : 0;
  let s = `<rect x="-1000" y="-200" width="2600" height="1000" fill="#F5EBDD"/><rect x="-1000" y="470" width="2600" height="400" fill="#B08968"/>`;
  // the window with the sea at night
  s += `<rect x="110" y="50" width="440" height="270" rx="8" fill="#0D1B3E"/><path d="M110,200 ${[...Array(12)].map((_, i) => `Q${130 + i * 38},${190 + 6 * Math.sin(T * 1.5 + i)} ${148 + i * 38},200`).join(' ')} V320 H110Z" fill="#1E5AA8"/>${img('crescent-moon', 460, 140, 80)}<path d="M380,210 h120" stroke="#FFE082" stroke-width="3" opacity=".6"/><rect x="110" y="50" width="440" height="270" rx="8" fill="none" stroke="#fff" stroke-width="12"/><path d="M330,50 V320" stroke="#fff" stroke-width="8"/><path d="M90,40 q40,140 0,300 h40 q30,-150 -10,-300z" fill="#C0392B"/><path d="M570,40 q-40,140 0,300 h-40 q-30,-150 10,-300z" fill="#C0392B"/>`;
  // the radiator under the window, the air conditioning on the wall
  const heat = since('heat') >= 0 ? cl(since('heat') / 1.2) : 0;
  s += `<rect x="190" y="340" width="290" height="80" rx="8" fill="${heat > 0 ? `rgb(${230},${Math.round(230 - 90 * heat)},${Math.round(230 - 150 * heat)})` : '#E6E6E6'}" stroke="#B0B0B0" stroke-width="3"/>${[...Array(9)].map((_, i) => `<path d="M${210 + i * 30},348 v64" stroke="#B0B0B0" stroke-width="3"/>`).join('')}`;
  if (heat > 0) s += [0, 1, 2, 3].map(i => `<path d="M${230 + i * 60},${330 - ((T * 30 + i * 15) % 40)} q10,-12 0,-24 q-10,-12 0,-24" stroke="#FF7043" stroke-width="4" fill="none" opacity="${heat * 0.8}"/>`).join('');
  const acOn = since('ac') < 0.9;
  s += `<rect x="600" y="20" width="260" height="66" rx="12" fill="#FAFAFA" stroke="#B0BEC5" stroke-width="3"/><path d="M620,70 h220" stroke="#90A4AE" stroke-width="4"/><circle cx="830" cy="38" r="5" fill="${acOn ? '#4FC3F7' : '#BDBDBD'}"/>`;
  if (acOn && SC.id === 'chambre') s += [0, 1, 2].map(i => `<path d="M${640 + i * 80},${96 + ((T * 50 + i * 20) % 50)} q12,10 0,20 q-12,10 0,20" stroke="#4FC3F7" stroke-width="4" fill="none" opacity=".75"/>`).join('');
  // the bathroom on the left, behind the wall
  s += `<rect x="-1000" y="-200" width="1000" height="1000" fill="#D6EAF0"/><rect x="-1000" y="470" width="1000" height="400" fill="#B0BEC5"/>${[...Array(8)].map((_, r) => [...Array(10)].map((_, c) => `<rect x="${-560 + c * 56}" y="${40 + r * 54}" width="54" height="52" fill="#E8F4F8"/>`).join('')).join('')}<rect x="-20" y="40" width="30" height="430" fill="#C8B49A"/>`;
  s += DR.dryer(-380, 180, 1.2) + `<path d="M-260,300 h160" stroke="#9E9E9E" stroke-width="8" stroke-linecap="round"/><path d="M-250,300 v-20 M-110,300 v-20" stroke="#9E9E9E" stroke-width="6"/>`;
  if (since('give') >= 1.0) s += DR.towel(-180, 330, 1.1);
  // the door on the right

function camTarget(t) {
  return at(t, () => {
    const id = SC.id;
    if (id === 'accueil') return [620, 330, 1.04];
    if (id === 'chambre') {
      if (since('bye') > -0.3) return [420, 280, 1.15];
      if (since('knock') > -0.3) return [700, 350, 1.0];
      if (since('phone') > 0.2) return [720, 330, 1.08];
      if (since('bath') > -0.2) return [-160, 300, 1.2];
      if (since('cold') > -0.2) return [560, 300, 1.06];
      if (since('window') > -0.4 && since('window') < 2.4) return [400, 220, 1.3];
      return [640, 360, 1.0];
    }
    // the hotel
    if ((since('auberge') > -0.3 && since('cdh') < 4.4) || (since('resa') > -0.3 && since('key1') < 2.4)) return [640, 330, 1.04];
    const l = TL.lines.find(l => t >= l.start - 0.3 && t <= l.end + 0.5 && l.scene === id);
    if (!l || !where(l.who)) return [640, 360, 1];
    const p = where(l.who);
    return [p.x + (p.x < 640 ? 130 : -140), 330, 1.22];
  });
}
function camera() {
  // one sample per video frame on a fixed time grid, weighted so the newest count most: the camera glides, never steps
  const f1 = Math.round(T * 30), n = 36;
  let c = [0, 0, 0], ws = 0;
  for (let i = 0; i < n; i++) { const wgt = Math.sin((i + 1) / (n + 1) * Math.PI); const p = camTarget((f1 - n + 1 + i) / 30); c = c.map((v, j) => v + p[j] * wgt); ws += wgt; }
  return c.map(v => v / ws);
}
