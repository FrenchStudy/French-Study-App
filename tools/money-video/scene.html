<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,'DejaVu Sans',sans-serif}
#svg{position:absolute;inset:0}
#sub{position:absolute;left:0;right:0;bottom:0;padding:14px 60px 18px;background:linear-gradient(transparent,rgba(12,10,20,.86) 28%);text-align:center;color:#fff}
#sub .who{display:inline-block;font-size:17px;font-weight:700;padding:2px 12px;border-radius:999px;margin-bottom:6px;letter-spacing:.03em}
#sub .fr{font-size:32px;font-weight:600;line-height:1.25;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#sub .fr b{color:#FFD54A;font-weight:800}
#sub .en{font-size:21px;color:#e6e0ef;font-style:italic;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
#cap{position:absolute;color:#fff;font-weight:800;white-space:nowrap;text-shadow:0 3px 12px rgba(0,0,0,.6)}
#cue{position:absolute;right:18px;top:14px;display:flex;gap:8px}
#cue .c{background:rgba(255,255,255,.93);border-radius:14px;padding:6px 12px 7px;box-shadow:0 3px 10px rgba(0,0,0,.25);color:#222;display:flex;align-items:center;gap:8px}
#cue img{width:36px;height:36px}
#cue .big{font-size:22px;font-weight:900}
#cue .sm{font-size:13px;font-weight:600;color:#555;line-height:1.2}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style></head>
<body><div id="stage"><svg id="svg" width="1280" height="720" viewBox="0 0 1280 720"></svg><div id="cap"></div><div id="cue"></div><div id="sub"></div><div id="black"></div></div>
<script>
let TL = null, T = 0, SC = null;
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = cl(x); return x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const back = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const mix = (a, b, k) => a + (b - a) * cl(k);
const evs = (name) => TL.events.filter(e => e[0] === name && e[2] === SC.id);
const ev = (name) => { const e = evs(name)[0]; return e ? e[1] : 1e9; };
const evd = (name) => { const e = evs(name)[0]; return e ? e[3] : 0; };
const since = (name) => T - ev(name);
const amp = (who) => (TL.amp[who] || [])[Math.round(T * TL.fps)] || 0;
const speaking = (who) => TL.lines.some(l => l.who === who && T >= l.start && T <= l.end);
const lineEnd = (who, k) => { const l = TL.lines.filter(l => l.who === who && l.scene === SC.id)[k]; return l ? l.end : 1e9; };
const img = (f, x, y, s) => `<image href="pics/${f}.png" x="${x - s / 2}" y="${y - s}" width="${s}" height="${s}"/>`;
const tag = (t, x, y, k = 1, col = '#22223B') => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x - t.length * 4.7 - 11}" y="${y}" width="${t.length * 9.4 + 22}" height="28" rx="14" fill="${col}" opacity=".93"/><text x="${x}" y="${y + 19.5}" text-anchor="middle" font-size="17" font-weight="700" fill="#FFE9B0">${t}</text></g>`;
const fadeIn = (n, d = .3) => cl(since(n) / d);
const win = (n, a, b, f = .3) => cl((since(n) - a) / f) * cl((b - since(n)) / f);   // shown from a to b seconds after the event
const check = (x, y, k) => k <= 0 ? '' : `<g opacity="${k}" transform="translate(${x},${y}) scale(${back(k)})"><circle r="16" fill="#16A34A"/><path d="M-8,0 l5,6 l10,-12" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/></g>`;
const bubble = (x, y, w, h, tx, ty, k, body) => k <= 0 ? '' : `<g opacity="${k}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="22" fill="#fff" stroke="#22223B" stroke-width="3"/><path d="M${tx - 24},${y + h - 2} L${tx},${ty} L${tx + 24},${y + h - 2}Z" fill="#fff" stroke="#22223B" stroke-width="3" stroke-linejoin="round"/><rect x="${tx - 22}" y="${y + h - 6}" width="44" height="8" fill="#fff"/>${body}</g>`;

// ---------- people ----------
const P = {
  L: { file: 'lea', col: '#B11F1F', skin: '#F1C3A5', name: ['Léa', '#B11F1F'] },
  W: { file: 'serveuse', col: '#263238', skin: '#B98E6A', name: ['la serveuse', '#263238'] },
  B: { file: 'banque', col: '#334155', skin: '#F1C3A5', name: ['la conseillère de la banque', '#334155'] },
  C: { file: 'change', col: '#0D9488', skin: '#E0AC69', name: ['le bureau de change', '#0D9488'] },
  K: { file: 'camille', col: '#F97316', skin: '#F1C3A5', name: ['Camille', '#D9600B'] },
};
const CAST = { cafe: ['L', 'W'], banque: ['L', 'B'], change: ['L', 'C'], soir: ['L', 'K'] };
const OTHER = { cafe: 'W', banque: 'B', change: 'C', soir: 'K' };

function where(who) {
  const id = SC.id, w = evs('walk')[0];
  const walkIn = (from, to) => !w ? to : T < w[1] ? from : mix(from, to, ease((T - w[1]) / w[3]));
  if (id === 'soir') return who === 'L' ? { x: 440, top: 160, size: 300, sit: true } : { x: 840, top: 160, size: 300, sit: true };
  if (who !== 'L') return { x: 1010, top: 108, size: 290 };
  let x = walkIn(-320, 560);
  if (id === 'banque') {   // to the cash machine and back
    const a = evs('atm')[0];
    if (a) { const s = T - a[1]; if (s >= 0) x = s < 1.0 ? mix(560, 300, ease(s / 1.0)) : s < a[3] - 0.6 ? 300 : mix(300, 560, ease((s - a[3] + 0.6) / 1.4)); }
  }
  return { x, top: 92, size: 300 };
}
function at(t, f) { const t0 = T; T = t; const r = f(); T = t0; return r; }
const walking = (who) => { const a = where(who), b = at(T - 0.04, () => where(who)); return a && b && Math.abs(a.x - b.x) > 0.6; };

function faceSvg(who, x, top, size, tilt) {
  const a = speaking(who) ? amp(who) : 0;
  let m = a < 0.07 ? 'smile' : a < 0.5 ? 'laugh' : 'agape';
  let e = 'happy';
  if (who === 'L') {
    if (since('pay') >= 0.8 && since('note') < -1.6) { e = 'wide'; if (!speaking('L')) m = 'agape'; }
    if (since('pay') >= 2.2 && since('note') < -0.2 && !speaking('L')) m = 'sad';
    if ((since('tip') >= 0.5 && since('tip') < 4) || (since('free') >= 0.3 && since('free') < 3) || (since('atm') >= 3 && since('atm') < 4.4) || since('bye') >= 0) e = 'bow';
    if (since('calc') >= 0.3 && since('calc') < 2.6) e = 'wide';
  }
  if (who === 'K' && ((since('give') >= 0.4 && since('give') < 3) || since('bye') >= 0)) e = 'bow';
  if (who === 'K' && since('lend') >= -1.4 && since('lend') < 0.6 && !speaking('K')) m = 'sad';
  if (who === 'W' && since('tip') >= 1 && since('tip') < 5) e = 'bow';
  const blink = ((T + { L: 0.4, W: 1.9, B: 1.1, C: 2.6, K: 0.9 }[who]) % 3.7) < 0.13;
  if (blink) e = 'humble';
  return `<g transform="rotate(${tilt},${x},${top + size * 0.95})"><image href="chars/${P[who].file}-${m}-${e}.svg" x="${x - size / 2}" y="${top}" width="${size}" height="${size}"/></g>`;
}
function headMove(who, p) {
  let tilt = 0;
  const o = who === 'L' ? OTHER[SC.id] : 'L';
  if (speaking(o)) tilt = (where(o).x > p.x ? 1 : -1) * 2.5;
  const ended = TL.lines.filter(l => l.who === o && T > l.end && T < l.end + 0.7);
  if (ended.length) tilt += Math.sin((T - ended[0].end) / 0.7 * Math.PI) * 4;
  if (speaking(who)) tilt += Math.sin(T * 3.1) * 1.2;
  return tilt;
}
function body(who) {
  const p = where(who); if (!p) return '';
  const c = P[who].col, wk = walking(who) ? Math.abs(Math.sin(T * 9)) * 6 : 0;
  const sc = p.size / 300, y0 = p.top - wk + p.size * 0.93;
  let extra = '';
  if (who === 'W') extra = `<rect x="${p.x - 64}" y="${y0 + 40}" width="128" height="420" rx="8" fill="#ECEFF1"/>`;
  if (who === 'B' || who === 'C') extra = `<path d="M${p.x - 22},${y0} L${p.x},${y0 + 60} L${p.x + 22},${y0}Z" fill="#F1F5F9"/>`;
  return `<g><rect x="${p.x - 92 * sc}" y="${y0}" width="${184 * sc}" height="${p.sit ? 150 : 460}" rx="${26 * sc}" fill="${c}"/>${extra}${faceSvg(who, p.x, p.top - wk, p.size, headMove(who, p))}</g>`;
}
function arm(who, x1, y1, x2, y2, x3, y3) {
  return `<path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="${P[who].col}" stroke-width="30" fill="none" stroke-linecap="round"/><path d="M${x1},${y1} Q${x2},${y2} ${x3},${y3}" stroke="#000" stroke-opacity=".08" stroke-width="30" fill="none" stroke-linecap="round"/><circle cx="${x3}" cy="${y3}" r="15" fill="${P[who].skin}"/>`;
}
// hands reach out when something passes between them
const HANDS = { L: ['tap', 'note', 'depot', 'chg', 'give'], W: ['coin'], B: [], C: ['calc'], K: ['give'] };
function arms(who) {
  const p = where(who); if (!p) return '';
  const sh = p.top + p.size * 0.95, x = p.x, A = (...a) => arm(who, ...a), s = who === 'L' ? 1 : -1;
  const down = (d) => A(x + d * 90, sh + 20, x + d * 112, sh + 110, x + d * 96, sh + 196);
  const desk = (d) => A(x + d * 90, sh + 20, x + d * 110, sh + 110, x + d * 70, sh + 150);
  const lap = (d) => `<circle cx="${x + d * 60}" cy="${sh + 110}" r="15" fill="${P[who].skin}"/>`;
  const giving = HANDS[who].some(n => since(n) >= 0 && since(n) < 1.4);
  if (p.sit) return lap(-s) + (giving ? A(x + s * 90, sh + 20, x + s * 160, sh + 60, x + s * 200, sh + 60) : lap(s));
  if (who === 'L' && SC.id === 'banque' && since('atm') >= 1.0 && since('atm') < 3.6) return down(1) + A(x - 90, sh + 20, x - 140, sh - 10, x - 170, sh - 40);
  if (who === 'B' && since('q_atm') >= 0.4 && since('q_atm') < 3.6) return desk(1) + A(x - 90, sh + 20, x - 170, sh - 10, x - 250, sh - 30);
  const rest = who === 'L' ? down : desk;
  return rest(-s) + (giving ? A(x + s * 90, sh + 20, x + s * 160, sh + 80, x + s * 220, sh + 50) : rest(s));
}

// ---------- small drawings ----------
const cardSvg = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-48" y="-30" width="96" height="60" rx="8" fill="#1D4ED8"/><rect x="-48" y="-14" width="96" height="10" fill="#0F172A"/><rect x="-36" y="6" width="22" height="16" rx="3" fill="#FACC15"/><path d="M24,6 q6,8 0,16 M30,4 q8,10 0,20" stroke="#fff" stroke-width="2.5" fill="none"/></g>`;
const cheque = (x, y, s = 1) => `<g transform="translate(${x},${y}) scale(${s})"><rect x="-70" y="-32" width="140" height="64" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="2"/><text x="-60" y="-12" font-size="11" font-weight="800" fill="#059669">CHÈQUE</text><path d="M-60,6 h80 M-60,20 h50" stroke="#94A3B8" stroke-width="2"/><text x="56" y="22" text-anchor="end" font-size="14" font-weight="800" fill="#065F46">300 €</text></g>`;
const X = (x, y, k, r = 34) => k <= 0 ? '' : `<g opacity="${k}" stroke="#E53935" stroke-width="9" stroke-linecap="round"><path d="M${x - r},${y - r} L${x + r},${y + r} M${x + r},${y - r} L${x - r},${y + r}"/></g>`;
const fly = (draw, n, t0, x0, y0, x1, y1, d = 0.8) => { const g = since(n) - t0; if (g < 0) return ''; const q = ease(g / d); return draw(mix(x0, x1, q), mix(y0, y1, q) - Math.sin(cl(g / d) * Math.PI) * 50); };

// ---------- places ----------
function counterBack(title, col, wall) {
  return `<rect x="-400" y="-200" width="2100" height="1000" fill="${wall}"/><rect x="-400" y="470" width="2100" height="400" fill="#A1887F"/><rect x="760" y="34" width="500" height="60" rx="8" fill="${col}"/><text x="1010" y="74" text-anchor="middle" font-size="26" font-weight="800" fill="#fff" letter-spacing="2">${title}</text>`;
}
function counter(col) { return `<rect x="760" y="452" width="500" height="320" fill="${col}"/><rect x="750" y="440" width="520" height="22" rx="4" fill="#3E2723"/>`; }
function cafeRoom() {
  let s = counterBack('CAFÉ DE LA GARE', '#3E2723', '#E8D5B7');
  s += `<rect x="40" y="120" width="320" height="220" rx="8" fill="#2F3B35" stroke="#8D5B3A" stroke-width="10"/><text x="200" y="164" text-anchor="middle" font-size="24" font-weight="700" fill="#F4F1E8">La carte</text><text x="70" y="206" font-size="18" fill="#F4F1E8">Café ........... 2,50 €</text><text x="70" y="240" font-size="18" fill="#F4F1E8">Croissant ...... 2,00 €</text><text x="70" y="290" font-size="15" fill="#F4F1E8" opacity=".8">prix TTC · service compris</text>`;
  return s;
}
function cafeCounter() {
  const p = since('pay');
  let scr = '#0F172A', txt = 'CB · 4,50 €', tc = '#7CFC9A';
  if (p >= 0.6) { scr = '#7F1D1D'; txt = 'REFUSÉE'; tc = '#fff'; }
  if (since('note') >= 0) { scr = '#0F172A'; txt = 'espèces'; tc = '#94A3B8'; }
  let s = counter('#5D4037') + img('hot-beverage', 1110, 446, 70) + img('croissant', 1180, 446, 64);
  s += `<g transform="translate(860,410)"><rect x="-40" y="-36" width="80" height="78" rx="10" fill="#334155"/><rect x="-30" y="-28" width="60" height="30" rx="4" fill="${scr}"/><text x="0" y="-8" text-anchor="middle" font-size="11" font-weight="800" fill="${tc}">${txt}</text>${[0, 1, 2].map(i => `<rect x="${-26 + i * 20}" y="10" width="14" height="10" rx="2" fill="#94A3B8"/>`).join('')}</g>`;
  s += `<g transform="translate(1040,410)"><path d="M-30,-30 h60 l-6,70 h-48z" fill="#E0F2FE" stroke="#7DD3FC" stroke-width="3" opacity=".9"/><text x="0" y="56" text-anchor="middle" font-size="11" font-weight="800" fill="#5D4037">POURBOIRES</text>${since('tip') >= 1.4 ? img('coin', 0, 34, 34) : ''}</g>`;
  return s;
}
function bankRoom() {
  let s = counterBack('BANQUE DU CENTRE', '#334155', '#E2E8F0');
  // the cash machine on the left
  const a = since('atm');
  let screen = '<text x="0" y="-8" text-anchor="middle" font-size="16" font-weight="800" fill="#7CFC9A">Bienvenue</text>';
  if (a >= 1.0) screen = `<text x="0" y="-18" text-anchor="middle" font-size="14" font-weight="700" fill="#7CFC9A">Code :</text><text x="0" y="12" text-anchor="middle" font-size="28" font-weight="900" fill="#7CFC9A">${'•'.repeat(Math.min(4, Math.max(0, Math.floor((a - 1.0) / 0.28) + 1)))}</text>`;
  if (a >= 2.4) screen = `<text x="0" y="-18" text-anchor="middle" font-size="14" font-weight="700" fill="#7CFC9A">Solde :</text><text x="0" y="12" text-anchor="middle" font-size="24" font-weight="900" fill="#7CFC9A">1 250 €</text>`;
  s += `<g transform="translate(110,250)"><rect x="-90" y="-180" width="180" height="420" rx="12" fill="#475569"/>${img('atm-sign', 0, -116, 64)}<rect x="-64" y="-100" width="128" height="80" rx="6" fill="#0F172A"/><g transform="translate(0,-56)">${screen}</g><rect x="-60" y="0" width="120" height="70" rx="6" fill="#64748B"/>${[0, 1, 2].map(r => [0, 1, 2].map(c => `<rect x="${-46 + c * 32}" y="${8 + r * 20}" width="26" height="14" rx="3" fill="#CBD5E1"/>`).join('')).join('')}<rect x="-50" y="90" width="100" height="10" rx="3" fill="#0F172A"/></g>`;
  if (a >= 2.8 && a < 4.2) s += img('euro-banknote', 110, 380 + Math.min(1, (a - 2.8) / .5) * 40, 90);
  return s;
}
function changeRoom() {
  let s = counterBack('BUREAU DE CHANGE', '#0D9488', '#F0FDFA');
  const r = since('rate') >= 0 ? 0.5 + 0.5 * Math.sin(T * 6) : 0;
  s += `<g transform="translate(40,110)"><rect x="0" y="0" width="360" height="230" rx="10" fill="#0F172A"/><text x="20" y="38" font-size="20" font-weight="800" fill="#FACC15">TAUX DE CHANGE · 1 €</text>${[['USD $', '1,10'], ['GBP £', '0,85'], ['CHF', '0,95'], ['JPY ¥', '160']].map(([c, v], i) => `${i === 0 ? `<rect x="10" y="${54}" width="340" height="38" rx="5" fill="#FACC15" opacity="${r * .35}"/>` : ''}<text x="24" y="${82 + i * 42}" font-size="22" font-weight="700" fill="#F8FAFC">${c}</text><text x="330" y="${82 + i * 42}" text-anchor="end" font-size="22" font-weight="800" fill="#7CFC9A">${v}</text>`).join('')}</g>`;
  return s;
}
function livingRoom() {
  let s = `<rect x="-400" y="-200" width="2100" height="1000" fill="#EDE7F6"/><rect x="-400" y="520" width="2100" height="300" fill="#A1887F"/>`;
  s += `<rect x="520" y="60" width="240" height="170" rx="6" fill="#0D1B3E" stroke="#fff" stroke-width="10"/><circle cx="700" cy="110" r="22" fill="#FFF3C4"/>${img('statue-of-liberty', 1120, 300, 150)}<rect x="1040" y="290" width="160" height="12" fill="#8D6E63"/>`;
  s += `<rect x="200" y="260" width="900" height="200" rx="40" fill="#5C6BC0"/>`;   // the back of the sofa
  return s;
}
function sofaFront() {
  let s = `<rect x="160" y="430" width="980" height="130" rx="30" fill="#3F51B5"/><rect x="140" y="380" width="80" height="180" rx="30" fill="#3949AB"/><rect x="1080" y="380" width="80" height="180" rx="30" fill="#3949AB"/>`;
  s += `<rect x="380" y="600" width="540" height="40" rx="10" fill="#6D4C41"/>`;
  // the piggy bank on the table
  const sv = since('save');
  s += img('pig-face', 640, 520, 110 * (sv >= 0.5 && sv < 1.0 ? 1.08 : 1)) + `<text x="640" y="546" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">la tirelire</text>`;
  if (sv >= 0 && sv < 0.7) s += img('coin', 640, mix(300, 440, sv / 0.7), 50);
  return s;
}

// ---------- what pops up ----------
function pops() {
  let s = '';
  const L = where('L');
  if (SC.id === 'cafe') {
    const pr = since('price');
    if (pr >= 0 && since('tip') < 0.4) {
      const k = cl(pr / .3) * cl((0.4 - since('tip')) / .3);
      s += `<g opacity="${k}" transform="translate(70,100)"><rect x="0" y="0" width="300" height="${since('tva') >= 0 ? 196 : since('serv') >= 0 ? 160 : 124}" rx="8" fill="#fff" stroke="#B0A58F" stroke-width="2"/><text x="18" y="32" font-size="15" font-weight="800" fill="#5D4037">L'ADDITION</text><text x="18" y="62" font-size="18" fill="#222">Café ........................ 2,50 €</text><text x="18" y="88" font-size="18" fill="#222">Croissant ................. 2,00 €</text><text x="18" y="114" font-size="19" font-weight="800" fill="#222">Total ...................... 4,50 €</text>${since('serv') >= 0 ? `<text x="18" y="148" font-size="17" font-weight="800" fill="#16A34A">service compris ✓</text>` : ''}${since('tva') >= 0 ? `<text x="18" y="182" font-size="17" font-weight="800" fill="#16A34A">TVA comprise ✓ (TTC)</text>` : ''}</g>`;
    }
    s += tag('sans contact ?', 860, 330, win('tap', 0, 2.2)) + fly((x, y) => cardSvg(x, y, .8), 'pay', 0, L.x + 150, 400, 860, 370, 0.6);
    if (since('pay') >= 0.6 && since('note') < 0) s += X(860, 400, cl((since('pay') - .6) / .3), 30) + tag('ma carte ne marche pas', 860, 470, cl((since('pay') - .8) / .3), '#C62828');
    s += fly((x, y) => img('euro-banknote', x, y, 90), 'note', 0.2, L.x + 180, 430, 900, 450) + tag('un billet de 5 €', 900, 470, win('note', 0.8, 2.8), '#1D4ED8');
    s += since('coin') < 3 ? fly((x, y) => img('coin', x, y, 56), 'coin', 0.2, 900, 440, L.x + 190, 420) : '';
    s += tag('une pièce de 50 centimes', 780, 470, win('coin', 0.8, 3.0), '#A16207');
    s += fly((x, y) => img('coin', x, y, 40), 'tip', 0.6, L.x + 190, 420, 1040, 440) + tag('gardez la monnaie = le pourboire', 820, 470, win('tip', 1.2, 4.6), '#16A34A');
  }
  if (SC.id === 'banque') {
    s += tag('le distributeur', 110, 30, win('q_atm', 0.2, 3.6), '#334155');
    s += tag('le code', 110, 520, win('atm', 1.0, 2.4)) + tag('le solde', 110, 520, win('atm', 2.4, 4.4));
    const v = since('vir');
    if (v >= 0 && v < 4.2) s += `<g opacity="${win('vir', 0, 4.2)}" transform="translate(70,40)"><rect x="0" y="0" width="300" height="130" rx="12" fill="#fff" stroke="#334155" stroke-width="3"/><text x="18" y="32" font-size="15" font-weight="800" fill="#334155">UN VIREMENT</text><text x="18" y="74" font-size="22" font-weight="800" fill="#B11F1F">Léa</text><text x="214" y="74" font-size="22" font-weight="800" fill="#D9600B">Camille</text><g transform="translate(${100 + ((v * 60) % 80)},62)">${img('money-with-wings', 0, 20, 50)}</g><text x="150" y="112" text-anchor="middle" font-size="22" font-weight="900" fill="#222">100 €</text></g>`;
    const c = since('compte');
    if (c >= 0 && c < 4.2) s += `<g opacity="${win('compte', 0, 4.2)}" transform="translate(70,190)"><rect x="0" y="0" width="300" height="120" rx="12" fill="#0F172A"/><text x="18" y="32" font-size="15" font-weight="800" fill="#93C5FD">MON COMPTE</text><text x="18" y="70" font-size="20" font-weight="700" fill="#F8FAFC">Solde : 1 150 €</text>${since('frais') >= 0 ? `<text x="18" y="102" font-size="18" font-weight="800" fill="#7CFC9A">frais : 0 € ✓</text>` : ''}</g>`;
    s += fly((x, y) => cheque(x, y, .9), 'depot', 0.3, L.x + 170, 420, 880, 430) + tag('déposer un chèque', 860, 470, win('depot', 1.0, 3.4), '#059669');
    const p = since('pret');
    if (p >= 0 && p < 3.6) s += `<g opacity="${win('pret', 0, 3.6)}">${img('house', 640, 300, 110 * back(p / .4))}${tag('un prêt', 640, 310, 1, '#334155')}</g>`;
  }
  if (SC.id === 'change') {
    const ny = since('ny');
    if (ny >= 0 && ny < 3.4) s += bubble(60, 90, 240, 170, 300, 300, win('ny', 0, 3.4), img('statue-of-liberty', 140, 240, 120) + img('airplane', 240, 160, 60));
    const e = since('eur');
    if (e >= 0 && since('calc') < 3.6) {
      const k = cl(e / .3) * cl((3.6 - since('calc')) / .4), cv = since('calc') >= 0 ? 1 : 0;
      s += `<g opacity="${k}" transform="translate(640,380)">${img('euro-banknote', -100, 40, 100)}<text x="-100" y="70" text-anchor="middle" font-size="22" font-weight="900" fill="#1D4ED8">${cv ? '200 €' : 'euros'}</text><text x="0" y="10" text-anchor="middle" font-size="40" font-weight="900" fill="#0D9488">→</text><g opacity="${cl(since('usd') / .3)}">${img('dollar-banknote', 100, 40, 100)}<text x="100" y="70" text-anchor="middle" font-size="22" font-weight="900" fill="#15803D">${cv ? '220 $' : 'dollars'}</text></g></g>`;
    }
    s += tag('1 € = 1,10 $ : le taux de change', 220, 350, win('rate', 0, 4.4), '#0D9488');
    const m = since('museum');
    if (m >= 0 && m < 7) {
      const k = win('museum', 0, 7);
      s += `<g opacity="${k}">${bubble(80, 90, 320, 200, 360, 320, 1, img('classical-building', 170, 240, 120) + `<text x="310" y="170" text-anchor="middle" font-size="24" font-weight="900" fill="#222" opacity="${cl(since('tarif') / .3)}">30 $</text><text x="310" y="200" text-anchor="middle" font-size="15" font-weight="700" fill="#555" opacity="${cl(since('tarif') / .3)}">le tarif</text>`)}${since('free') >= 0 ? `<g transform="translate(240,250) rotate(-12)" opacity="${cl(since('free') / .3)}"><rect x="-110" y="-30" width="220" height="60" rx="10" fill="none" stroke="#16A34A" stroke-width="6"/><text x="0" y="14" text-anchor="middle" font-size="34" font-weight="900" fill="#16A34A">GRATUIT</text></g>` : ''}</g>`;
    }
  }
  if (SC.id === 'soir') {
    const sp = since('spend');
    if (sp >= 0 && sp < 3) s += `<g opacity="${win('spend', 0, 3)}">${[0, 1, 2].map(i => img('money-with-wings', 440 + i * 60, 200 - ((sp * 60 + i * 30) % 90), 60)).join('')}${tag('dépenser', 500, 60)}</g>`;
    s += tag('économiser', 640, 250, win('save', 0.2, 3.2), '#16A34A');
    s += since('give') < 2.4 ? fly((x, y) => img('euro-banknote', x, y, 90), 'give', 0.2, 580, 420, 780, 420) : '';
    const g = since('give');
    if (g >= 0.6 && since('bye') < 0.5) {
      const k = cl((g - .6) / .3) * cl((0.5 - since('bye')) / .5);
      s += `<g opacity="${k}" transform="translate(640,70)"><rect x="-230" y="0" width="460" height="${since('owe') >= 0 ? 150 : since('borrow') >= 0 ? 112 : 74}" rx="14" fill="#fff" stroke="#22223B" stroke-width="3"/><text x="-210" y="44" font-size="22" font-weight="800" fill="#B11F1F">Léa prête 20 € →</text>${since('borrow') >= 0 ? `<text x="-210" y="84" font-size="22" font-weight="800" fill="#D9600B">→ Camille emprunte 20 €</text>` : ''}${since('owe') >= 0 ? `<text x="-210" y="124" font-size="22" font-weight="800" fill="#22223B">Camille doit 20 € à Léa</text>` : ''}</g>`;
    }
  }
  return s;
}

// ---------- camera ----------
function camTarget(t) {
  return at(t, () => {
    const id = SC.id;
    if (id === 'soir') return [640, 340, 1.04];
    if (id === 'banque' && since('atm') > -0.2 && since('atm') < evd('atm') - 0.4) return [260, 300, 1.25];
    if (id === 'change' && since('rate') > -0.3 && since('rate') < 3.6) return [520, 320, 1.04];
    return [660, 330, 1.05];
  });
}
function camera() {
  // one sample per video frame on a fixed time grid, weighted so the newest count most: the camera glides, never steps
  const f1 = Math.round(T * 30), n = 36;
  let c = [0, 0, 0], ws = 0;
  for (let i = 0; i < n; i++) { const wgt = Math.sin((i + 1) / (n + 1) * Math.PI); const p = camTarget((f1 - n + 1 + i) / 30); c = c.map((v, j) => v + p[j] * wgt); ws += wgt; }
  return c.map(v => v / ws);
}
const CUE = {
  cafe: ['euro-banknote', '1 € = 100 centimes', 'un billet · une pièce'], banque: ['bank', 'la banque', 'retirer · déposer · virer'], change: ['dollar-banknote', 'changer', 'des euros en dollars'], soir: ['pig-face', 'prêter ≠ emprunter', 'je prête → tu empruntes'],
};
function render(t) {
  T = t;
  SC = TL.scenes.find(s => t >= s.start && t < s.end) || TL.scenes[TL.scenes.length - 1];
  const [cx, cy, z] = camera();
  let w = '';
  if (SC.id === 'cafe') w += cafeRoom() + body('W') + cafeCounter() + arms('W') + body('L') + arms('L');
  if (SC.id === 'banque') w += bankRoom() + body('B') + counter('#475569') + arms('B') + body('L') + arms('L');
  if (SC.id === 'change') w += changeRoom() + body('C') + counter('#0F766E') + arms('C') + body('L') + arms('L');
  if (SC.id === 'soir') w += livingRoom() + body('L') + body('K') + sofaFront() + arms('L') + arms('K');
  w += pops();
  document.getElementById('svg').innerHTML = `<g transform="translate(640,360) scale(${z}) translate(${-cx},${-cy})">${w}</g>`;
  const fin = cl((t - SC.start) / 0.45), fout = cl((SC.end - t) / 0.45);
  document.getElementById('black').style.opacity = 1 - Math.min(fin, fout);
  const cap = document.getElementById('cap'), parts = SC.caption.split(' · ');
  cap.innerHTML = `${parts[0]} <span style="opacity:.85;font-weight:600">· ${parts[1]}</span>`;
  const k = ease((t - SC.start - 1.3) / 0.6);
  cap.style.fontSize = mix(60, 26, k) + 'px';
  cap.style.left = mix(640 - cap.offsetWidth / 2, 24, k) + 'px';
  cap.style.top = mix(290, 16, k) + 'px';
  cap.style.opacity = cl((t - SC.start - 0.15) / 0.35);
  const cue = CUE[SC.id], ce = document.getElementById('cue');
  ce.innerHTML = `<div class="c"><img src="pics/${cue[0]}.png"><div><div class="big">${cue[1]}</div><div class="sm">${cue[2]}</div></div></div>`;
  ce.style.opacity = cl((t - SC.start - 1.8) / 0.5);
  const sub = TL.subs.find(s => t >= s.start && t < s.end), box = document.getElementById('sub');
  if (sub) {
    const who = P[sub.who].name;
    box.style.opacity = cl((t - sub.start) / 0.15) * cl((sub.end - t) / 0.15);
    box.innerHTML = `<div class="who" style="background:${who[1]}">${who[0]}</div><div class="fr">${sub.fr.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')}</div><div class="en">${sub.en}</div>`;
  } else box.style.opacity = 0;
}
window.load = async (tl) => {
  TL = tl;
  const names = [];
  for (const w of ['lea', 'serveuse', 'banque', 'change', 'camille']) for (const m of ['smile', 'laugh', 'agape', 'sad']) for (const e of ['happy', 'humble', 'bow', 'wide']) names.push(`chars/${w}-${m}-${e}.svg`);
  for (const f of ['airplane', 'atm-sign', 'bank', 'classical-building', 'coin', 'croissant', 'dollar-banknote', 'euro-banknote', 'hot-beverage', 'house', 'money-with-wings', 'pig-face', 'statue-of-liberty']) names.push(`pics/${f}.png`);
  await Promise.all(names.map(n => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = n; })));
};
