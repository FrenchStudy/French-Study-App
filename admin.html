<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Atelier de Français - Administration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden font-sans">

    <!-- Top Sticky Navigation Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2 text-xs font-semibold overflow-x-auto py-2">
                <a href="index.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Dashboard</a>
                <a href="syllabus.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Syllabus</a>
                <a href="lesson.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Lesson</a>
                <a href="vocab.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Vocab</a>
                <a href="reading.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Reading</a>
                <a href="listening.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Listening</a>
                <a href="writing.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Writing</a>
                <a href="speaking.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Speaking</a>
                <a href="admin.html" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg shadow-sm transition">Administration</a>
            </div>
            <div class="flex items-center space-x-2">
                <span id="user-role-badge" class="text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-medium">Mode Dev : Admin</span>
                <button onclick="logoutAdmin()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg transition font-medium">Déconnexion</button>
            <div class="flex items-center space-x-2">
                <button id="logoutBtn" class="text-slate-600 hover:text-red-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Logout</button>
            </div>
            </div>
        </div>
    </header>

    <!-- Admin Workspace -->
    <div id="admin-workspace" class="flex-1 flex overflow-hidden">
        <main class="flex-1 overflow-y-auto p-8 max-w-4xl mx-auto space-y-8 w-full">
            
            <!-- Page Title -->
            <div>
                <h1 id="workspace-title" class="text-2xl font-extrabold text-slate-900 tracking-tight">Panneau d'Administration</h1>
                <p id="workspace-subtitle" class="text-xs text-slate-500 mt-1">Configurez les paramètres globaux de l'IA pour toute la suite d'apprentissage.</p>
            </div>

            <!-- SECTION: Global AI Model Configuration -->
            <div id="global-ai-settings-card" class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm space-y-4">
                <div class="flex items-center space-x-2 border-b border-slate-100 pb-3">
                    <span class="text-indigo-600 font-bold text-base">⚙️</span>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-800">Configuration Globale de l'IA (Groq / Modèle)</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Clé API Globale :</label>
                        <input type="password" id="global-api-key-input" placeholder="gsk_..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 mb-1">Modèle d'IA Actif :</label>
                        <input type="text" id="global-model-input" value="openai/gpt-oss-120b" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                </div>
                <div>
                    <button onclick="saveGlobalAISettings()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm">💾 Sauvegarder les paramètres globaux</button>
                </div>
            </div>

        </main>
    </div>

    <!-- Script Integration -->
    <script>
        const SUPABASE_URL = 'https://bkawfexaikntyivqvetk.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJrYXdmZXhhaWtudHlpdnF2ZXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDU3ODAsImV4cCI6MjEwMjc4MTc4MH0.8YYkD8pzn97DeqA-o83KoGQ4yHb6WT1HB4DcoPPAMwA';
        
        if (!window.mySupabase) {
            window.mySupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                db: { schema: 'French-schema' }
            });
        }

        function loadAdminSettings() {
            document.getElementById('global-api-key-input').value = localStorage.getItem('ai_api_key') || "";
            document.getElementById('global-model-input').value = localStorage.getItem('ai_model_name') || "openai/gpt-oss-120b";
        }

        function saveGlobalAISettings() {
            const key = document.getElementById('global-api-key-input').value.trim();
            const model = document.getElementById('global-model-input').value.trim();
            
            if (key) localStorage.setItem('ai_api_key', key);
            if (model) localStorage.setItem('ai_model_name', model);
            
            alert("✅ Paramètres globaux de l'IA enregistrés avec succès !");
        }

        function logoutAdmin() {
            window.location.href = 'index.html';
        }

        // Initialize settings view on load
        loadAdminSettings();
    </script>
</body>
</html>
