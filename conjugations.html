<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grammar - French Study App</title>
    <script>
        // Conjugations is now part of Grammar: verb tables are its "Verb tables" tab,
        // and the verb lessons are in the Grammar course.
        (function () {
            const p = new URLSearchParams(location.search);
            let to = 'lesson.html?tab=verbs';
            if (p.get('verb')) to = 'lesson.html?tab=verbs&verb=' + encodeURIComponent(p.get('verb'));
            else if (p.get('lesson')) to = 'lesson.html?c=' + encodeURIComponent(p.get('lesson'));
            else if (p.get('tab') === 'lessons') to = 'lesson.html';
            location.replace(to);
        })();
    </script>
</head>
<body><p><a href="lesson.html">Go to Grammar</a></p></body>
</html>
