<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugations - French Study App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/conjugate.js"></script>
    <script src="js/lessons-data.js"></script>
    <script src="js/lesson-kit.js"></script>
    <style>.en-end { color: #4f46e5; } .lk-body b { color: #0f172a; }</style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden font-sans text-slate-800">

    <header id="app-header" class="bg-white border-b border-slate-200 sticky top-0 z-50 shrink-0 h-14"></header>

    <main id="scroller" class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 py-5 space-y-4">
            <div>
                <h1 class="text-2xl font-black text-slate-900">Conjugations</h1>
                <p class="text-sm text-slate-500 mt-1">Verb tables for 296 verbs in 12 tenses, and 44 lessons from A1 to C2.</p>
            </div>

            <nav class="flex gap-1 sm:gap-6 border-b border-slate-200 text-sm font-semibold overflow-x-auto" role="tablist" aria-label="Conjugations">
                <button data-tab="tables" role="tab" class="tab-btn shrink-0 min-h-[44px] px-2 sm:px-0 border-b-2 -mb-px">Verb tables</button>
                <button data-tab="lessons" role="tab" class="tab-btn shrink-0 min-h-[44px] px-2 sm:px-0 border-b-2 -mb-px">Lessons</button>
            </nav>

            <!-- ===== VERB TABLES ===== -->
            <section id="tab-tables">
              <div class="md:grid md:grid-cols-[18rem_1fr] md:gap-5 space-y-4 md:space-y-0">
                <aside class="space-y-3 md:sticky md:top-0 md:self-start">
                    <input type="search" id="verb-search" placeholder="Verb (FR) or meaning (EN), Enter to conjugate"
                           oninput="filterVerbList(this.value)" onkeydown="if(event.key==='Enter') conjugateTyped(this.value)"
                           class="w-full text-base px-3 py-3 bg-white border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <div class="flex gap-1.5 overflow-x-auto md:flex-wrap pb-1 text-sm">
                        <button onclick="filterVerbs('all', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-indigo-600 border border-indigo-600 text-white">All</button>
                        <button onclick="filterVerbs('er', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">-er (1st group)</button>
                        <button onclick="filterVerbs('ersp', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">-er spelling change</button>
                        <button onclick="filterVerbs('ir', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">-ir (2nd group)</button>
                        <button onclick="filterVerbs('re', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">-re regular</button>
                        <button onclick="filterVerbs('irr', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">Irregular</button>
                        <button onclick="filterVerbs('refl', this)" class="filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50">Reflexive</button>
                    </div>
                    <div id="verb-list-container" class="space-y-1 max-h-56 md:max-h-[65vh] overflow-y-auto pr-1 bg-white border border-slate-200 rounded-xl p-2">
                        <p class="text-sm text-slate-400 p-2">Loading verbs…</p>
                    </div>
                </aside>

                <div id="verb-detail" class="space-y-4 min-w-0">
                    <div class="flex items-start justify-between gap-3 flex-wrap">
                        <div class="min-w-0">
                            <h2 id="atelier-title" class="text-2xl font-black text-slate-900 break-words">Choose a verb</h2>
                            <p id="atelier-category" class="text-sm text-slate-500 mt-0.5"></p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="playNativeAudio()" class="min-h-[44px] px-3 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold rounded-xl">🔊 Listen</button>
                            <button onclick="adjustSpeed()" id="speed-btn" class="min-h-[44px] px-3 bg-white border border-slate-200 text-slate-700 text-sm font-semibold rounded-xl">⚡ 1x</button>
                            <button onclick="exportLesson()" class="min-h-[44px] px-3 bg-white border border-slate-200 text-slate-700 text-sm font-semibold rounded-xl">📤 Export</button>
                        </div>
                    </div>

                    <div class="bg-amber-50 border border-amber-200 rounded-2xl p-4">
                        <div class="text-sm font-bold text-amber-900 mb-1">💡 About this verb</div>
                        <div id="rule-text" class="text-base text-amber-900 leading-relaxed">Pick a verb to see its forms. Tap any row to hear it.</div>
                    </div>

                    <div id="tense-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-4"></div>
                </div>
              </div>
            </section>

            <!-- ===== LESSONS ===== -->
            <section id="tab-lessons" class="hidden">
                <div id="conj-lessons"></div>
            </section>
        </div>
    </main>

    <script>
        const db = window.mySupabase;
        let currentPlaybackSpeed = 1.0;
        let currentFilter = 'all';
        const PILL_OFF = 'filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-white border border-slate-200 text-slate-700 hover:bg-slate-50';
        const PILL_ON = 'filter-pill shrink-0 min-h-[40px] px-3 rounded-lg font-medium bg-indigo-600 border border-indigo-600 text-white';

        // Accent-insensitive match: "etre" finds "être"
        function plain(s) {
            return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
        }

        // ---- Conjugation engine (js/conjugate.js): no AI, no network ----
        const C = window.Conjugator;
        const SPELLING_KINDS = ['e_è', 'é_è', 'll', 'tt', 'yer', 'envoyer'];
        const GROUP_LABELS = { er: 'regular -er', ersp: '-er, spelling change', ir: 'regular -ir', re: 'regular -re', irr: 'irregular', refl: 'reflexive' };
        let activeVerb = null;

        function verbGroup(v) {
            if (v.refl) return 'refl';
            if (v.kind === 'er' || v.kind === 'ir' || v.kind === 're') return v.kind;
            if (SPELLING_KINDS.includes(v.kind)) return 'ersp';
            return 'irr';
        }


        function filterVerbs(category, buttonElement) {
            currentFilter = category;
            document.querySelectorAll('.filter-pill').forEach(btn => {
                btn.className = PILL_OFF;
            });
            buttonElement.className = PILL_ON;
            populateVerbList(document.getElementById('verb-search').value);
        }

        function filterVerbList(query) {
            populateVerbList(query);
        }

        // Accent-insensitive match: "etre" finds "être"
        function plain(s) {
            return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
        }

        function populateVerbList(searchQuery = '') {
            const container = document.getElementById('verb-list-container');
            if (!container) return;
            const q = plain(searchQuery);
            const matches = C.verbs.filter(v =>
                (currentFilter === 'all' || verbGroup(v) === currentFilter) &&
                (!q || plain(v.disp).includes(q) || plain(v.gloss).includes(q))
            );

            container.innerHTML = '';
            if (matches.length === 0) {
                const typed = escapeHtml(searchQuery.trim());
                container.innerHTML = typed
                    ? `<p class="text-sm text-slate-500 p-2">No verb found. Press Enter to conjugate “${typed}”.</p>`
                    : `<p class="text-sm text-slate-400 p-2">No verb found.</p>`;
                return;
            }

            matches.forEach(v => {
                const item = document.createElement('button');
                item.type = 'button';
                item.className = 'w-full text-left px-3 py-2 min-h-[48px] rounded-lg text-sm bg-slate-50 hover:bg-indigo-50 transition flex items-center justify-between border border-slate-100' + (activeVerb === v ? ' ring-2 ring-indigo-400' : '');
                item.innerHTML = `
                    <div class="flex flex-col pr-2 overflow-hidden">
                        <span class="font-bold text-slate-900 truncate">${escapeHtml(v.disp)}</span>
                        <span class="text-xs text-slate-500 truncate">${escapeHtml(v.gloss)}</span>
                    </div>
                    <span class="text-[10px] text-slate-400 uppercase shrink-0">${GROUP_LABELS[verbGroup(v)]}</span>
                `;
                item.addEventListener('click', () => { renderVerb(v); showTablesOnPhone(); });
                container.appendChild(item);
            });

            if (!activeVerb) renderVerb(matches[0]);
        }

        // Conjugate a verb typed in the search box, even if it is not in the list
        function conjugateTyped(text) {
            const v = C.find(text);
            if (v) {
                renderVerb(v);
                showTablesOnPhone();
            } else if (text.trim()) {
                document.getElementById('rule-text').innerText = `“${text.trim()}” is not recognised as an -er, -ir or -re infinitive.`;
            }
        }

        function formatForm(row) {
            // "j'" + "aime" has no space; "je" + "parle" does
            return /'$/.test(row.cp) ? row.cp + row.cf : row.cp + ' ' + row.cf;
        }

        function renderVerb(v) {
            if (!v) return;
            activeVerb = v;

            const title = document.getElementById('atelier-title');
            title.dataset.activeVerb = v.disp;
            title.innerText = v.gloss ? `${v.disp} (${v.gloss})` : v.disp;
            document.getElementById('atelier-category').innerText =
                `${GROUP_LABELS[verbGroup(v)]} · auxiliary: ${v.refl ? 'être' : v.aux}`;
            document.querySelectorAll('#verb-list-container button').forEach(b => b.classList.remove('ring-2', 'ring-indigo-400'));

            const grid = document.getElementById('tense-grid');
            grid.innerHTML = C.tenses.map(t => {
                const rows = C.forms(v, t.key);
                if (!rows.length) return '';
                const body = rows.map(r => `
                    <tr class="hover:bg-indigo-50/50 cursor-pointer" data-say="${escapeHtml(r.say)}">
                        <td class="px-3 py-2 text-slate-500 w-2/5">${escapeHtml(r.cp)}</td>
                        <td class="px-3 py-2 font-bold text-slate-800 text-base">${C.highlight(v, t.key, r.i, r.cf)}</td>
                    </tr>`).join('');
                return `
                    <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col">
                        <div class="bg-slate-50 border-b border-slate-200 px-3 py-2 text-center">
                            <div class="font-bold text-xs text-slate-700 uppercase tracking-wider">${escapeHtml(t.name)}</div>
                            <div class="text-[10px] text-slate-400">${escapeHtml(t.en)}</div>
                        </div>
                        <table class="w-full text-sm text-left"><tbody class="divide-y divide-slate-100">${body}</tbody></table>
                    </div>`;
            }).join('');

            document.getElementById('rule-text').innerText = C.notes(v).join(' ');
        }

        // Tap any row to hear it
        document.addEventListener('click', (event) => {
            const row = event.target.closest('#tense-grid tr[data-say]');
            if (row) speakText(row.dataset.say);
        });

        window.speakText = function(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'fr-FR';
            utterance.rate = currentPlaybackSpeed;
            window.speechSynthesis.speak(utterance);
        };

        function playNativeAudio() {
            if (activeVerb) speakText(activeVerb.disp);
        }

        function adjustSpeed() {
            const speeds = [1.0, 0.75, 0.5];
            const idx = speeds.indexOf(currentPlaybackSpeed);
            currentPlaybackSpeed = speeds[(idx + 1) % speeds.length];
            const btn = document.getElementById('speed-btn');
            if (btn) btn.innerText = `⚡ ${currentPlaybackSpeed}x`;
        }

        function exportLesson() {
            if (!activeVerb) return;
            const lines = [`# ${activeVerb.disp}${activeVerb.gloss ? ' (' + activeVerb.gloss + ')' : ''}`, ''];
            C.tenses.forEach(t => {
                const rows = C.forms(activeVerb, t.key);
                if (!rows.length) return;
                lines.push(`## ${t.name}`, '');
                rows.forEach(r => lines.push(`- ${formatForm(r)}`));
                lines.push('');
            });
            const blob = new Blob([lines.join('\n')], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${activeVerb.inf}-conjugation.md`;
            a.click();
            URL.revokeObjectURL(url);
        }


        // On phones the list sits above the tables: jump down to the tables after picking a verb
        function showTablesOnPhone() {
            if (window.innerWidth < 768) document.getElementById('verb-detail').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ---------- Tabs ----------
        const lessons = LessonKit.mount(document.getElementById('conj-lessons'), {
            section: 'conjugation',
            pagePath: 'conjugations.html',
            param: 'lesson',
            keepParams: { tab: 'lessons' },
            searchPlaceholder: 'Search, e.g. passé composé'
        });

        function setTab(name, push) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                const on = b.dataset.tab === name;
                b.classList.toggle('border-indigo-600', on); b.classList.toggle('text-indigo-700', on);
                b.classList.toggle('border-transparent', !on); b.classList.toggle('text-slate-500', !on); b.classList.toggle('hover:text-slate-800', !on);
                b.setAttribute('aria-selected', on);
            });
            document.getElementById('tab-tables').classList.toggle('hidden', name !== 'tables');
            document.getElementById('tab-lessons').classList.toggle('hidden', name !== 'lessons');
            try { localStorage.setItem('conj_tab', name); } catch (e) {}
            if (push) history.pushState({}, '', name === 'lessons' ? 'conjugations.html?tab=lessons' : 'conjugations.html');
        }
        document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', () => {
            setTab(b.dataset.tab, true);
            if (b.dataset.tab === 'lessons') lessons.showList(false);
        }));

        // Verb links inside lessons open the verb's tables here, without reloading
        document.addEventListener('click', (e) => {
            const a = e.target.closest('a[href^="conjugations.html?verb="]');
            if (!a) return;
            e.preventDefault();
            const v = C.find(new URLSearchParams(a.getAttribute('href').split('?')[1]).get('verb'));
            if (!v) return;
            history.pushState({}, '', a.getAttribute('href'));
            setTab('tables', false);
            renderVerb(v);
            populateVerbList(document.getElementById('verb-search').value);
            document.getElementById('scroller').scrollTop = 0;
        });

        // ---------- Routing: ?verb=finir, ?lesson=12, ?tab=lessons ----------
        function route() {
            const p = new URLSearchParams(location.search);
            if (p.get('lesson') || p.get('tab') === 'lessons') {
                setTab('lessons', false);
                lessons.route(p);
                return;
            }
            if (p.get('verb')) {
                setTab('tables', false);
                renderVerb(C.find(p.get('verb')));
                return;
            }
            let saved = 'tables';
            try { saved = localStorage.getItem('conj_tab') || 'tables'; } catch (e) {}
            setTab(saved === 'lessons' ? 'lessons' : 'tables', false);
            if (saved === 'lessons') lessons.showList(false);
        }
        window.addEventListener('popstate', route);

        route();
        populateVerbList();
    </script>
</body>
</html>
