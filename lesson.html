<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar - Apprendre le Français</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Français">
    <link rel="stylesheet" href="css/app.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.104.0"></script>
    <script>window.supabase || document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>
    <script src="config.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/conjugate.js"></script>
    <script src="js/lessons-data.js"></script>
    <script src="js/lessons-index.js"></script>
    <script src="js/lesson-kit.js"></script>
    <style>.en-end { color: #4f46e5; } .lk-body b { color: #0f172a; }</style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden font-sans text-slate-800">

    <header id="app-header" class="bg-white border-b border-slate-200 sticky top-0 z-50 shrink-0 h-14"></header>

    <main id="scroller" class="flex-1 overflow-y-auto">
        <div class="max-w-6xl mx-auto px-4 py-5 space-y-4">
            <div id="page-head">
                <h1 class="text-2xl font-black text-slate-900">Grammar</h1>
                <p class="text-sm text-slate-500 mt-1">One course from A1 to C2, with the verb tenses included. Verb tables are in <a href="conjugations.html" class="text-indigo-700 font-semibold hover:underline">Conjugations</a>.</p>
            </div>

            <!-- ===== LESSONS ===== -->
            <div id="grammar"></div>


        </div>
    </main>

    <script>
        // ---------- The course ----------
        const grammar = LessonKit.mount(document.getElementById('grammar'), {
            section: 'grammar',
            pagePath: 'lesson.html',
            param: 'g',
            searchPlaceholder: 'Search, e.g. subjonctif',
            onViewChange: (open) => document.getElementById('page-head').classList.toggle('hidden', open)
        });

        // ---------- Routing: ?g=33, ?g=v6; older links still work (verb tables moved to Conjugations) ----------
        const OLD_TITLES = {
            "l'alphabet": 'lalphabet', 'les nombres': 'nombres',
            'objets personnels': 'objets-personnels', 'objets de la classe': 'objets-classe', 'les nationalités': 'nationalites',
            'les professions': 'professions', 'la famille proche': 'famille-proche', "l'heure & les prix": 'lheure-prix',
            'météo, date & jours': 'meteo-date-jours', 'les loisirs (hobbies)': 'loisirs-hobbies',
            'articles définis / indéfinis / partitifs': 'articles-definis-indefinis-partitifs',
            'prépositions de temps & lieu': 'prepositions-temps-lieu'
        };
        function openInteractive(id) {
            const item = LessonKit.INTERACTIVE.find(x => x.id === id);
            if (!item) return false;
            location.replace(item.embedIn ? LessonKit.URLS.grammar(item.embedIn[0]) : LessonKit.URLS.interactive(id));
            return true;
        }
        function route() {
            const p = new URLSearchParams(location.search);
            if (p.get('c')) return location.replace(LessonKit.URLS.conjugation(p.get('c')));
            if ({ 'noms-prenoms': 1, ladresse: 1 }[p.get('i')]) return location.replace('vocab.html?lesson=' + p.get('i'));
            if (p.get('i') && openInteractive(p.get('i'))) return;
            if (p.get('topic')) {
                const old = p.get('topic').trim();
                const MERGED = { 'noms et prénoms': 'theme:1', "l'adresse": 'theme:4' };   // lessons folded into Vocab topics
                if (MERGED[old.toLowerCase()]) return location.replace('vocab.html?topic=' + MERGED[old.toLowerCase()]);
                if (OLD_TITLES[old.toLowerCase()] && openInteractive(OLD_TITLES[old.toLowerCase()])) return;
                grammar.route(new URLSearchParams());
                grammar.search(old.replace(/\(.*?\)/g, '').trim());
                return;
            }
            if (p.get('verb')) return location.replace('conjugations.html?verb=' + encodeURIComponent(p.get('verb')));
            if (p.get('tab') === 'verbs') return location.replace('conjugations.html');
            grammar.route(p);
        }
        window.addEventListener('popstate', () => grammar.route(new URLSearchParams(location.search)));
        route();
    </script>
</body>
</html>
