<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grammar - French Study App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/conjugate.js"></script>
    <script src="js/lessons-data.js"></script>
    <script src="js/lesson-kit.js"></script>
    <style>.en-end { color: #4f46e5; } .lk-body b { color: #0f172a; }</style>
</head>
<body class="h-full bg-slate-100 flex flex-col overflow-hidden font-sans text-slate-800">

    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shrink-0">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2 text-xs font-semibold overflow-x-auto py-2">
                <a href="index.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Dashboard</a>
                 <a href="vocab.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Vocab</a>
                <a href="lesson.html" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg shadow-sm transition">Grammar</a>
                <a href="conjugations.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Conjugates</a>
                 <a href="reading.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Reading</a>
                <a href="listening.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Listening</a>
                <a href="writing.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Writing</a>
                <a href="speaking.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Speaking</a>
                <a href="translator.html" class="text-slate-600 hover:text-indigo-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Translator</a>
                <a href="admin.html" class="text-indigo-600 hover:text-indigo-800 hover:bg-indigo-50 px-3 py-1.5 rounded-lg transition font-bold">Administration</a>
            </div>
            <div class="flex items-center space-x-2">
                
                <button id="logoutBtn" class="text-slate-600 hover:text-red-600 hover:bg-slate-100 px-3 py-1.5 rounded-lg transition">Logout</button>
            </div>
        </div>
    </header>

    <main class="flex-1 overflow-y-auto">
        <div id="grammar" class="max-w-6xl mx-auto px-4 py-5"></div>
    </main>

    <script>
        const grammar = LessonKit.mount(document.getElementById('grammar'), {
            section: 'grammar',
            pagePath: 'lesson.html',
            param: 'g',
            intro: `<div>
                <h1 class="text-2xl font-black text-slate-900">Grammar</h1>
                <p class="text-sm text-slate-500 mt-1">78 lessons from A1 to C2. Tap a lesson to open it; tick it off when you're done.
                Verb tables and conjugation lessons are in <a href="conjugations.html" class="text-indigo-700 font-semibold underline">Conjugations</a>;
                vocabulary and interactive lessons are in <a href="vocab.html" class="text-indigo-700 font-semibold underline">Vocab</a>.</p>
            </div>`
        });

        // Older links: conjugation and vocabulary lessons moved to their own pages
        const OLD_TITLES = {
            "l'alphabet": 'lalphabet', 'les nombres': 'nombres', 'noms et prénoms': 'noms-prenoms', "l'adresse": 'ladresse',
            'objets personnels': 'objets-personnels', 'objets de la classe': 'objets-classe', 'les nationalités': 'nationalites',
            'les professions': 'professions', 'la famille proche': 'famille-proche', "l'heure & les prix": 'lheure-prix',
            'météo, date & jours': 'meteo-date-jours', 'les loisirs (hobbies)': 'loisirs-hobbies',
            'articles définis / indéfinis / partitifs': 'articles-definis-indefinis-partitifs',
            'prépositions de temps & lieu': 'prepositions-temps-lieu'
        };
        function openInteractive(id) {
            const item = LessonKit.INTERACTIVE.find(x => x.id === id);
            if (!item) return false;
            location.replace(item.embedIn ? LessonKit.URLS.grammar(item.embedIn[0]) : LessonKit.URLS.interactive(id));
            return true;
        }
        function route() {
            const p = new URLSearchParams(location.search);
            if (p.get('c')) return location.replace(LessonKit.URLS.conjugation(p.get('c')));
            if (p.get('i') && openInteractive(p.get('i'))) return;
            if (p.get('topic')) {
                const old = p.get('topic').trim();
                if (OLD_TITLES[old.toLowerCase()] && openInteractive(OLD_TITLES[old.toLowerCase()])) return;
                grammar.route(new URLSearchParams());
                grammar.search(old.replace(/\(.*?\)/g, '').trim());
                return;
            }
            grammar.route(p);
        }
        window.addEventListener('popstate', () => grammar.route(new URLSearchParams(location.search)));
        route();
    </script>
</body>
</html>
